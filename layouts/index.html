<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宿舍布置参考 · 合肥理工学院</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
    background: #0d0d0f;
    color: #eaeaef;
    -webkit-font-smoothing: antialiased;
    padding: 48px 24px 40px;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }

  /* ========== Header ========== */
  .header {
    width: 100%; max-width: 1000px;
    margin-bottom: 40px;
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .header .left .kicker {
    font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
    color: rgba(255,255,255,0.15); text-transform: uppercase;
    margin-bottom: 8px;
  }
  .header .left h1 {
    font-size: 28px; font-weight: 650; letter-spacing: -0.3px;
    color: #f0f0f5;
  }
  .header .left p {
    font-size: 14px; color: rgba(255,255,255,0.3);
    margin-top: 6px;
  }
  .header .back {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 7px 16px; border-radius: 16px;
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.35); text-decoration: none;
    font-size: 12px; transition: background 0.2s, color 0.2s;
    flex-shrink: 0;
  }
  .header .back:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }

  /* ========== Grid ========== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    max-width: 1000px; width: 100%;
  }
  .card {
    border-radius: 14px;
    overflow: hidden;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.05);
    cursor: pointer;
    transition: border-color 0.25s, transform 0.25s;
  }
  .card:hover {
    border-color: rgba(255,255,255,0.12);
    transform: translateY(-2px);
  }
  .card .img-wrap {
    width: 100%; aspect-ratio: 4 / 3;
    background: rgba(255,255,255,0.02);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .card .img-wrap .placeholder {
    font-size: 32px; opacity: 0.15;
  }
  .card .img-wrap img {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
  }
  .card .info { padding: 14px 16px; }
  .card .info .author {
    font-size: 12px; color: rgba(255,255,255,0.25);
    margin-bottom: 2px;
  }
  .card .info .author strong {
    color: rgba(255,255,255,0.45); font-weight: 500;
  }
  .card .info .desc {
    font-size: 13px; color: rgba(255,255,255,0.5);
    line-height: 1.45;
  }

  /* ========== Empty state ========== */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center; padding: 80px 24px;
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state h2 { font-size: 20px; font-weight: 600; color: #f0f0f5; margin-bottom: 8px; }
  .empty-state p { font-size: 14px; color: rgba(255,255,255,0.25); line-height: 1.6; }
  .empty-state .btn {
    display: inline-block; margin-top: 20px;
    padding: 9px 22px; border-radius: 18px;
    background: rgba(255,255,255,0.06); border: none;
    color: rgba(255,255,255,0.4); font-size: 13px; cursor: pointer;
    font-family: inherit; text-decoration: none;
    transition: background 0.2s, color 0.2s;
  }
  .empty-state .btn:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); }

  /* ========== Lightbox ========== */
  .lightbox {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.92);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .lightbox.show { opacity: 1; pointer-events: auto; }
  .lightbox img {
    max-width: 90vw; max-height: 85vh;
    object-fit: contain; border-radius: 6px;
  }
  .lightbox .lb-close {
    position: absolute; top: 20px; right: 24px;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: none; color: rgba(255,255,255,0.5);
    font-size: 24px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .lightbox .lb-close:hover { background: rgba(255,255,255,0.14); color: #fff; }
  .lightbox .lb-author {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-size: 13px; color: rgba(255,255,255,0.35);
    background: rgba(0,0,0,0.6); padding: 6px 18px; border-radius: 16px;
  }

  /* ========== Responsive ========== */
  @media (max-width: 640px) {
    .header { flex-direction: column; align-items: flex-start; gap: 16px; }
    .header .left h1 { font-size: 22px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="left">
    <div class="kicker">Dorm Layouts</div>
    <h1>宿舍布置参考</h1>
    <p>看看学长学姐们是怎么布置自己的空间的</p>
  </div>
  <a class="back" href="../index.html">← 返回首页</a>
</div>

<div class="grid" id="grid"></div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">&times;</button>
  <img id="lbImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
  <div class="lb-author" id="lbAuthor"></div>
</div>

<script>
// ========== 数据 ==========
// 格式：{ img: '图片URL', author: '提供者昵称', desc: '简短描述' }
// 图片上传到 COS 后把 URL 填到这里即可
const LAYOUTS = [
  // 示例数据（等你收集后再替换）
  // { img: 'https://.../cos/img/layouts/example1.jpg', author: '匿名学长', desc: '书桌区域的收纳布置' },
];

// ========== 渲染 ==========
const grid = document.getElementById('grid');

if (LAYOUTS.length === 0) {
  grid.innerHTML = '<div class="empty-state"><div class="icon">🛋️</div><h2>正在收集中</h2><p>欢迎学长学姐投稿你们的宿舍布置照片<br>我们会标注提供者，给学弟学妹们做参考</p><a class="btn" href="../index.html">← 返回首页</a></div>';
} else {
  LAYOUTS.forEach(function(item, i) {
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div class="img-wrap"><img src="' + item.img + '" loading="lazy" alt=""></div><div class="info"><div class="author">来自 <strong>' + esc(item.author) + '</strong></div><div class="desc">' + esc(item.desc) + '</div></div>';
    card.addEventListener('click', function() {
      document.getElementById('lbImg').src = item.img;
      document.getElementById('lbAuthor').textContent = '来自 ' + item.author;
      document.getElementById('lightbox').classList.add('show');
    });
    grid.appendChild(card);
  });
}

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

// 灯箱
document.getElementById('lbClose').onclick = function() { document.getElementById('lightbox').classList.remove('show'); };
document.getElementById('lightbox').onclick = function(e) { if (e.target === this) this.classList.remove('show'); };
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('show'); });
</script>
</body>
</html>
