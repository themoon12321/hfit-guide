<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宿舍布置参考 · 合肥理工学院</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
    background: #0d0d0f;
    color: #eaeaef;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 24px; min-height: 100vh;
  }
  .card {
    text-align: center; max-width: 420px;
    animation: fadeUp 0.5s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card .icon { font-size: 48px; margin-bottom: 20px; }
  .card h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; color: #f0f0f5; }
  .card p { font-size: 14px; color: rgba(255,255,255,0.35); line-height: 1.6; margin-bottom: 28px; }
  .card .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 24px; border-radius: 20px;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.5); text-decoration: none;
    font-size: 13px; transition: background 0.2s, color 0.2s;
  }
  .card .btn:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }
  .card .hint { margin-top: 16px; font-size: 12px; color: rgba(255,255,255,0.12); }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🛋️</div>
  <h1>宿舍布置参考</h1>
  <p>正在收集中……<br>欢迎学长学姐投稿你们的宿舍布置照片</p>
  <a class="btn" href="../index.html">← 返回首页</a>
  <div class="hint">coming soon</div>
</div>
</body>
</html>
