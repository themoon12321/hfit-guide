<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ · 常见问题</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
    background: #0d0d0f; color: #eaeaef;
    -webkit-font-smoothing: antialiased;
    padding: 48px 16px 40px; max-width: 640px; margin: 0 auto;
  }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; padding: 0 4px; }
  .header .back { color: rgba(255,255,255,0.25); text-decoration: none; font-size: 18px; }
  .header .back:hover { color: rgba(255,255,255,0.6); }
  .header h1 { font-size: 20px; font-weight: 600; flex: 1; }

  .item {
    border-radius: 14px; border: 1px solid rgba(255,255,255,0.05);
    overflow: hidden; margin-bottom: 10px;
    transition: border-color 0.2s;
  }
  .item:hover { border-color: rgba(255,255,255,0.1); }
  .item .q {
    padding: 14px 18px; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 12px;
    transition: background 0.15s;
  }
  .item .q:hover { background: rgba(255,255,255,0.02); }
  .item .q .icon { font-size: 14px; color: rgba(255,255,255,0.15); flex-shrink: 0; }
  .item .q .text { font-size: 14px; color: rgba(255,255,255,0.7); flex: 1; line-height: 1.4; }
  .item .q .arrow {
    font-size: 12px; color: rgba(255,255,255,0.1);
    transition: transform 0.25s; flex-shrink: 0;
  }
  .item.open .q .arrow { transform: rotate(90deg); }

  .item .a {
    max-height: 0; overflow: hidden;
    transition: max-height 0.35s ease, padding 0.3s ease;
  }
  .item.open .a {
    max-height: 600px;
    padding: 0 18px 16px;
  }
  .item .a .inner {
    font-size: 13px; color: rgba(255,255,255,0.4);
    line-height: 1.7; padding-top: 4px;
    border-top: 1px solid rgba(255,255,255,0.04);
    white-space: pre-line;
  }

  .empty {
    text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.1);
  }

  @media (max-width: 480px) {
    body { padding: 32px 12px 32px; }
    .item .q { padding: 12px 14px; }
    .item.open .a { padding: 0 14px 14px; }
  }
</style>
</head>
<body>
<div class="header">
  <a class="back" href="../index.html">←</a>
  <h1>常见问题</h1>
</div>
<div id="list"></div>

<script>
const FAQ = [
  // 示例
  // { q: '床的尺寸是多少？', a: '床板尺寸约为 90cm × 200cm。' },
];

var list = document.getElementById('list');

if (FAQ.length === 0) {
  list.innerHTML = '<div class="empty">暂无问题 · 收集中</div>';
} else {
  FAQ.forEach(function(item, i) {
    var div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = '<div class="q"><span class="icon">Q</span><span class="text">' + esc(item.q) + '</span><span class="arrow">›</span></div><div class="a"><div class="inner">' + esc(item.a) + '</div></div>';
    div.querySelector('.q').addEventListener('click', function() { div.classList.toggle('open'); });
    list.appendChild(div);
  });
}

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
</script>
</body>
</html>
