<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>常见问题 · 合肥理工学院</title>
<meta name="description" content="关于宿舍、校园、选课、交通那些事——常见问题解答。">
<meta property="og:title" content="常见问题 · 合肥理工学院">
<meta property="og:description" content="关于宿舍、校园、选课、交通那些事——常见问题解答。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://hfit-guide-1459922161.cos.ap-nanjing.myqcloud.com/img/ann/D01.jpg">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
    background: #0d0d0f; color: #eaeaef;
    -webkit-font-smoothing: antialiased;
    padding: 32px 16px 48px; max-width: 640px; margin: 0 auto;
  }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .header .back { color: rgba(255,255,255,0.3); text-decoration: none; font-size: 18px; }
  .header .back:hover { color: rgba(255,255,255,0.6); }
  .header h1 { font-size: 20px; font-weight: 600; flex: 1; }
  .disclaimer {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 16px; border-radius: 12px;
    background: rgba(255,200,60,0.06);
    border: 1px solid rgba(255,200,60,0.12);
    font-size: 12px; color: rgba(255,215,110,0.55);
    line-height: 1.6; margin-bottom: 16px;
  }
  .disclaimer .icon { flex-shrink: 0; font-size: 14px; }
  .faq-updated { font-size: 11px; color: rgba(255,255,255,0.2); margin: -6px 2px 14px; font-feature-settings: "tnum"; }
  .search {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08); margin-bottom: 14px;
  }
  .search .mag { color: rgba(255,255,255,0.2); font-size: 14px; flex-shrink: 0; }
  .search input { flex: 1; background: none; border: none; outline: none; color: #eaeaef; font-size: 14px; font-family: inherit; }
  .search input::placeholder { color: rgba(255,255,255,0.2); }
  .tags-line { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .tags-line .tag-badge { padding: 2px 10px; border-radius: 10px; background: rgba(255,255,255,0.05); font-size: 11px; color: rgba(255,255,255,0.3); }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .tab {
    padding: 6px 16px; border-radius: 18px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.35); font-size: 12px; cursor: pointer;
    transition: all 0.2s; font-family: inherit;
  }
  .tab:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.6); }
  .tab.active { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.15); color: rgba(255,255,255,0.85); }
  .item {
    border-radius: 14px; border: 1px solid rgba(255,255,255,0.06);
    overflow: hidden; margin-bottom: 10px;
    background: rgba(255,255,255,0.02);
    transition: border-color 0.2s;
  }
  .item:hover { border-color: rgba(255,255,255,0.1); }
  .item .q {
    padding: 16px 18px; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 12px;
  }
  .item .q .q-mark { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.2); flex-shrink: 0; width: 20px; }
  .item .q .q-text { font-size: 15px; font-weight: 600; color: #f0f0f5; flex: 1; line-height: 1.5; }
  .item .q .arrow { font-size: 13px; color: rgba(255,255,255,0.15); transition: transform 0.25s; flex-shrink: 0; }
  .item .q .q-share { font-size: 13px; color: rgba(255,255,255,0.15); cursor: pointer; flex-shrink: 0; transition: color 0.2s; }
  .item .q .q-share:hover { color: rgba(255,255,255,0.7); }
  .item.open .q .arrow { transform: rotate(90deg); }
  .item .a { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
  .item.open .a { max-height: 62vh; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }
  .item.open .a::-webkit-scrollbar { width: 6px; }
  .item.open .a::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  .item.open .a::-webkit-scrollbar-track { background: transparent; }
  .item .a .inner {
    padding: 0 18px 18px 50px;
    font-size: 13px; color: rgba(255,255,255,0.55);
    line-height: 1.8; white-space: pre-line;
  }
  .item .a .inner strong { color: #fff; font-weight: 600; }
  .item .a .inner .hl { font-weight: 500; }
  .item .a .inner .hl.c-blue { color: #8ab4ff; }
  .item .a .inner .hl.c-green { color: #7cd98a; }
  .item .a .inner .hl.c-orange { color: #ffa54d; }
  .item .a .inner .hl.c-red { color: #ff6b6b; }
  .item .a .inner .hl.c-yellow { color: #f2d45c; }
  .item .a .inner .hl.c-purple { color: #c792ea; }
  .item .a .inner em { color: rgba(255,255,255,0.35); font-style: normal; }
  .empty { text-align: center; padding: 50px 20px; color: rgba(255,255,255,0.1); font-size: 13px; }
  .empty.hidden { display: none; }
  .feedback-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; margin-top: 28px;
    padding: 14px; border-radius: 14px;
    background: rgba(255,255,255,0.05);
    border: 1px dashed rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.35); font-size: 13px; cursor: pointer;
    font-family: inherit; transition: all 0.2s;
  }
  .feedback-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.6); }
  #fbModal {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  #fbModal.show { opacity: 1; pointer-events: auto; }
  .fb-box {
    width: 88%; max-width: 380px;
    background: #1a1a1e; border-radius: 16px;
    padding: 24px; border: 1px solid rgba(255,255,255,0.06);
  }
  .fb-box h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .fb-box .fb-sub { font-size: 12px; color: rgba(255,255,255,0.25); margin-bottom: 16px; }
  .fb-box input, .fb-box textarea {
    width: 100%; padding: 10px 12px;
    border-radius: 10px; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: #eaeaef; font-size: 13px; font-family: inherit;
    outline: none; margin-bottom: 10px;
  }
  .fb-box textarea { min-height: 70px; resize: vertical; }
  .fb-box .fb-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .fb-box .fb-btns button { padding: 8px 18px; border-radius: 10px; border: none; font-size: 13px; cursor: pointer; font-family: inherit; }
  .fb-box .fb-btns .cancel { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); }
  .fb-box .fb-btns .send { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }
  .item .a .inner .img-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .item .a .inner .img-list img {
    width: 72px; height: 72px; object-fit: cover;
    border-radius: 8px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.06);
    transition: transform 0.2s, border-color 0.2s;
  }
  .item .a .inner .img-list img:hover { transform: scale(1.08); border-color: rgba(255,255,255,0.15); }
  .lightbox {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.92);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  }
  .lightbox.show { opacity: 1; pointer-events: auto; }
  .lightbox img { max-width: 90vw; max-height: 85vh; object-fit: contain; border-radius: 6px; }
  .lightbox .lb-close {
    position: absolute; top: 20px; right: 24px;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: none;
    color: rgba(255,255,255,0.5); font-size: 24px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox .lb-close:hover { background: rgba(255,255,255,0.14); color: #fff; }
  .lightbox .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 22px;
    background: rgba(255,255,255,0.06); border: none;
    color: rgba(255,255,255,0.5); font-size: 22px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .lightbox .lb-nav:hover { background: rgba(255,255,255,0.14); color: #fff; }
  .lightbox .lb-prev { left: 16px; }
  .lightbox .lb-next { right: 16px; }
  .lightbox .lb-counter {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-size: 13px; color: rgba(255,255,255,0.4);
    background: rgba(0,0,0,0.5); padding: 4px 14px; border-radius: 14px;
    font-feature-settings: "tnum";
  }
  /* 答案更新时间 */
  .item .a .inner .updated { font-size: 11px; color: rgba(255,255,255,0.18); margin-top: 12px; }
  /* 置顶标识 */
  .pinned-tag { font-size: 11px; color: rgba(255,200,60,0.7); flex-shrink: 0; }
  /* 操作行：点赞按钮 */
  .ops-row { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
  .like-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 12px; border-radius: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.5); font-size: 12px;
    cursor: pointer; font-family: inherit;
    transition: all 0.2s;
  }
  .like-btn:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }
  .like-btn.liked { background: rgba(80,200,120,0.12); border-color: rgba(80,200,120,0.25); color: #4cd964; }
  .like-btn .like-count { font-feature-settings: "tnum"; font-size: 11px; opacity: 0.7; }
  /* 信号格热度（标题旁，手机信号格样式：等宽、高度递增） */
  .signal { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 11px; flex-shrink: 0; }
  .signal i { width: 3px; border-radius: 1px; background: rgba(80,200,120,0.15); transition: background 0.3s; }
  .signal i.on { background: #4cd964; }
  /* 排序切换 */
  .sort-row { display: flex; align-items: center; gap: 8px; margin: -8px 0 16px; padding: 0 4px; }
  .sort-label { font-size: 11px; color: rgba(255,255,255,0.2); }
  .sort-btn {
    padding: 3px 12px; border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.35); font-size: 11px;
    cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .sort-btn:hover { color: rgba(255,255,255,0.7); }
  .sort-btn.active { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.16); color: rgba(255,255,255,0.85); }
  /* Toast 提示 */
  .toast {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 400;
    padding: 10px 22px; border-radius: 22px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    font-size: 13px; color: rgba(255,255,255,0.85);
    opacity: 0; transition: opacity 0.3s ease;
    pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="header"><a class="back" href="../index.html">←</a><h1>常见问题</h1></div>
<div class="disclaimer"><span class="icon">⚠️</span><span>以下内容仅根据个人经验回答，仅供参考。实际以学校规定和现实情况为准。</span></div>
<div class="faq-updated" id="faqUpdated"></div>
<div class="search"><span class="mag">🔍</span><input type="text" id="searchInput" placeholder="搜索问题关键词…"></div>
<div class="tabs" id="tabs"></div>
<div class="sort-row">
  <span class="sort-label">排序</span>
  <button class="sort-btn active" data-sort="default">默认</button>
  <button class="sort-btn" data-sort="hot">🔥 热度</button>
</div>
<div id="list"></div>
<div class="empty hidden" id="empty">没有找到相关问题</div>
<button class="feedback-btn" id="fbBtn"><span>❓</span> 有问题没找到？点这里反馈</button>
<div id="fbModal"><div class="fb-box"><h3>提一个问题</h3><div class="fb-sub">我们会筛选整理后补充到 FAQ 里</div><input type="text" id="fbName" placeholder="昵称（可选）" maxlength="12"><textarea id="fbText" placeholder="说说你遇到的问题…"></textarea><div class="fb-btns"><button class="cancel" onclick="closeFb()">取消</button><button class="send" onclick="sendFb()">提交</button></div></div></div>
<div class="lightbox" id="lightbox"><button class="lb-close" id="lbClose">&times;</button><button class="lb-nav lb-prev" id="lbPrev">‹</button><img id="lbImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt=""><button class="lb-nav lb-next" id="lbNext">›</button><div class="lb-counter" id="lbCounter"></div></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
// FAQ 数据已抽离到 data.js

var allData = FAQ;
var currentTag = '全部';
var searchTerm = '';
var likeCounts = {};
var currentSort = 'default'; // default | hot

// 赞数 → 信号格数（0-5 格）
function levelOf(n) {
  if (n >= 21) return 5;
  if (n >= 11) return 4;
  if (n >= 6) return 3;
  if (n >= 3) return 2;
  if (n >= 1) return 1;
  return 0;
}

// 批量拉取该页所有条目的赞数
function loadLikes() {
  fetch('/api/likes?page=faq&items=1').then(function(r) { return r.json(); }).then(function(d) {
    likeCounts = d || {};
    render();
  }).catch(function() {});
}
// 板块最后更新时间（数据在 data.js 里维护）
if (typeof FAQ_UPDATED !== 'undefined' && FAQ_UPDATED) {
  document.getElementById('faqUpdated').textContent = '内容最后更新：' + FAQ_UPDATED;
}
function getTags(item) {
  if (item.tags && item.tags.length) return item.tags;
  if (item.tag) return [item.tag];
  return ['其他'];
}
(function() {
  var all = [];
  FAQ.forEach(function(x) { all = all.concat(getTags(x)); });
  var tags = ['全部'].concat(all.filter(function(v, i, s) { return s.indexOf(v) === i; }));
  var tabsEl = document.getElementById('tabs');
  tags.forEach(function(t) {
    var b = document.createElement('button');
    b.className = 'tab' + (t === '全部' ? ' active' : '');
    b.textContent = t;
    b.onclick = function() { currentTag = t; document.querySelectorAll('.tab').forEach(function(x) { x.classList.remove('active'); }); b.classList.add('active'); render(); };
    tabsEl.appendChild(b);
  });
})();
function render() {
  var list = document.getElementById('list');
  var filtered = allData.filter(function(item) {
    var okTag = currentTag === '全部' || getTags(item).indexOf(currentTag) > -1;
    var okSearch = !searchTerm || item.q.indexOf(searchTerm) > -1 || item.a.indexOf(searchTerm) > -1;
    return okTag && okSearch;
  });
  document.getElementById('empty').classList.toggle('hidden', filtered.length > 0);
  // 排序：置顶永远最前；热度模式按赞数降序
  var pinned = filtered.filter(function(x) { return x.pinned; });
  var rest = filtered.filter(function(x) { return !x.pinned; });
  if (currentSort === 'hot') {
    rest.sort(function(a, b) { return (likeCounts[b.id] || 0) - (likeCounts[a.id] || 0); });
  }
  filtered = pinned.concat(rest);
  list.innerHTML = '';
  filtered.forEach(function(item) {
    var div = document.createElement('div');
    div.className = 'item';
    // 用全量索引做锚点：搜索/标签过滤后分享出去的链接仍指向同一条
    var gIdx = allData.indexOf(item);
    div.id = 'faq-' + gIdx;
    var badges = getTags(item).map(function(t) { return '<span class="tag-badge">' + esc(t) + '</span>'; }).join('');
    var imgs = '';
    if (item.images && item.images.length) {
      var thumbs = item.images.map(function(src, j) {
        return '<img src="' + src + '" loading="lazy" data-idx="' + j + '">';
      }).join('');
      imgs = '<div class="img-list">' + thumbs + '</div>';
    }
    var updated = item.updated ? '<div class="updated">更新于 ' + esc(item.updated) + '</div>' : '';
    // 置顶标识 + 信号格（标题旁小尺寸）
    var pinTag = item.pinned ? '<span class="pinned-tag">📌 置顶</span>' : '';
    var likes = likeCounts[item.id] || 0;
    var level = levelOf(likes);
    var signal = '<div class="signal">' + [1,2,3,4,5].map(function(i) {
      return '<i class="' + (i <= level ? 'on' : '') + '" style="height:' + (i * 2 + 1) + 'px"></i>';
    }).join('') + '</div>';
    var liked = localStorage.getItem('liked_faq_' + item.id) === '1';
    var ops = '<div class="ops-row"><button class="like-btn' + (liked ? ' liked' : '') + '" data-id="' + item.id + '"><span class="like-txt">有用</span><span class="like-count">' + (likes > 0 ? likes : '') + '</span></button></div>';
    div.innerHTML = '<div class="q" tabindex="0" role="button"><span class="q-mark">Q</span><span class="q-text">' + esc(item.q) + '</span>' + pinTag + signal + '<span class="q-share" title="复制这条的链接">🔗</span><span class="arrow">›</span></div><div class="a"><div class="inner">' + badges + '<br>' + item.a + imgs + updated + ops + '</div></div>';
    div.querySelector('.q-share').addEventListener('click', function(e) {
      e.stopPropagation();
      var self = this;
      var url = location.origin + location.pathname + '#faq-' + gIdx;
      navigator.clipboard.writeText(url).then(function() {
        self.textContent = '✓';
        setTimeout(function() { self.textContent = '🔗'; }, 1500);
        showToast('链接已复制 ✓');
      }).catch(function() {
        showToast('复制失败，请手动复制地址栏链接');
      });
    });
    div.querySelector('.q').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.click(); }
    });
    div.querySelector('.q').addEventListener('click', function() {
      list.querySelectorAll('.item.open').forEach(function(o) {
        if (o !== div) { o.classList.remove('open'); o.querySelector('.a').style.maxHeight = '0px'; }
      });
      var isOpen = div.classList.toggle('open');
      var a = div.querySelector('.a');
      a.style.maxHeight = isOpen ? '62vh' : '0px';
      history.replaceState(null, '', '#faq-' + gIdx);
    });
    list.appendChild(div);
  });
}
document.getElementById('searchInput').addEventListener('input', function() { searchTerm = this.value.trim(); render(); });
document.getElementById('fbBtn').onclick = function() { document.getElementById('fbModal').classList.add('show'); };

/* ===== 点赞（条目级，信号格热度） ===== */
document.getElementById('list').addEventListener('click', function(e) {
  var btn = e.target.closest('.like-btn');
  if (!btn) return;
  e.preventDefault();
  var id = btn.dataset.id;
  var liked = btn.classList.toggle('liked');
  localStorage.setItem('liked_faq_' + id, liked ? '1' : '0');
  fetch('/api/likes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ page: 'faq', item: id, delta: liked ? 1 : -1 })
  })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      likeCounts[id] = d.count;
      var c = btn.querySelector('.like-count');
      c.textContent = d.count > 0 ? d.count : '';
      if (currentSort === 'hot') render();
    })
    .catch(function() { btn.classList.toggle('liked'); });
});

/* ===== 排序切换 ===== */
document.querySelectorAll('.sort-btn').forEach(function(b) {
  b.addEventListener('click', function() {
    currentSort = b.dataset.sort;
    document.querySelectorAll('.sort-btn').forEach(function(x) { x.classList.toggle('active', x === b); });
    render();
  });
});
function closeFb() { document.getElementById('fbModal').classList.remove('show'); }
function sendFb() {
  var text = document.getElementById('fbText').value.trim();
  var name = document.getElementById('fbName').value.trim();
  if (!text) return;
  fetch('/api/comments', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({page:'faq', nickname:name||'匿名', text:text}) })
    .then(function() { alert('已收到，感谢反馈！'); closeFb(); document.getElementById('fbText').value=''; document.getElementById('fbName').value=''; })
    .catch(function() { alert('提交失败'); });
}
document.getElementById('fbModal').onclick = function(e) { if (e.target === this) closeFb(); };
var lbImages = [];
var lbIndex = 0;
document.getElementById('list').addEventListener('click', function(e) {
  var img = e.target.closest('.img-list img');
  if (!img) return;
  var inner = img.closest('.inner');
  var thumbs = inner.querySelectorAll('.img-list img');
  lbImages = Array.from(thumbs).map(function(t) { return t.src; });
  lbIndex = parseInt(img.dataset.idx) || 0;
  showLb();
});
function showLb() {
  document.getElementById('lbImg').src = lbImages[lbIndex];
  var counter = document.getElementById('lbCounter');
  counter.textContent = (lbImages.length > 1) ? (lbIndex + 1) + ' / ' + lbImages.length : '';
  document.getElementById('lightbox').classList.add('show');
}
function lbNav(dir) {
  if (lbImages.length < 2) return;
  lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
  document.getElementById('lbImg').src = lbImages[lbIndex];
  document.getElementById('lbCounter').textContent = (lbIndex + 1) + ' / ' + lbImages.length;
}
document.getElementById('lbClose').onclick = function() { document.getElementById('lightbox').classList.remove('show'); };
document.getElementById('lbPrev').onclick = function(e) { e.stopPropagation(); lbNav(-1); };
document.getElementById('lbNext').onclick = function(e) { e.stopPropagation(); lbNav(1); };
document.getElementById('lightbox').onclick = function(e) { if (e.target === this) this.classList.remove('show'); };
document.addEventListener('keydown', function(e) {
  if (!document.getElementById('lightbox').classList.contains('show')) return;
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('show');
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
});
var lbSx = 0;
document.getElementById('lightbox').addEventListener('touchstart', function(e) { lbSx = e.changedTouches[0].screenX; });
document.getElementById('lightbox').addEventListener('touchend', function(e) {
  var dx = lbSx - e.changedTouches[0].screenX;
  if (Math.abs(dx) > 50) lbNav(dx > 0 ? 1 : -1);
});
function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

/* ===== Toast 提示 ===== */
var toastTimer;
function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, 1800);
}
render();
loadLikes();
// 深链接：打开带 #faq-N 的链接时自动展开对应条目
function openByHash() {
  var m = location.hash.match(/^#faq-(\d+)$/);
  if (!m) return;
  var target = document.getElementById('faq-' + m[1]);
  if (!target) return;
  target.querySelector('.q').click();
  setTimeout(function() { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 350);
}
openByHash();
</script>
