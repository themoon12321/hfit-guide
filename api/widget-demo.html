<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点赞留言 · Demo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
    background: #0d0d0f;
    color: #eaeaef;
    -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center;
    padding: 80px 24px;
  }

  /* ========== Widget Container ========== */
  .feedback-widget {
    width: 100%; max-width: 520px;
  }
  .feedback-widget .divider {
    height: 1px; background: rgba(255,255,255,0.06);
    margin-bottom: 32px;
  }

  /* ========== Like Button ========== */
  .like-area { margin-bottom: 40px; }
  .like-area .label {
    font-size: 13px; color: rgba(255,255,255,0.3);
    margin-bottom: 14px;
  }
  .like-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 24px; border-radius: 24px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.4);
    font-size: 15px; cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
    user-select: none;
  }
  .like-btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.7);
  }
  .like-btn:active { transform: scale(0.95); }
  .like-btn .count {
    font-size: 13px; font-feature-settings: "tnum";
    color: rgba(255,255,255,0.2);
    min-width: 16px; text-align: center;
  }
  .like-btn.liked {
    background: rgba(255,80,80,0.1);
    border-color: rgba(255,80,80,0.2);
    color: #ff6b6b;
  }
  .like-btn.liked .count { color: #ff6b6b; }

  /* ========== Comments ========== */
  .comment-area .section-title {
    font-size: 13px; color: rgba(255,255,255,0.3);
    margin-bottom: 16px;
  }
  .comment-form {
    display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 28px;
  }
  .comment-form .row {
    display: flex; gap: 10px;
  }
  .comment-form input,
  .comment-form textarea {
    flex: 1;
    padding: 10px 14px; border-radius: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    color: #eaeaef; font-size: 13px;
    font-family: inherit;
    outline: none; transition: border-color 0.2s;
  }
  .comment-form input::placeholder,
  .comment-form textarea::placeholder { color: rgba(255,255,255,0.15); }
  .comment-form input:focus,
  .comment-form textarea:focus { border-color: rgba(255,255,255,0.15); }
  .comment-form textarea {
    min-height: 64px; resize: vertical;
  }
  .comment-form .submit-btn {
    align-self: flex-end;
    padding: 8px 20px; border-radius: 10px;
    background: rgba(255,255,255,0.08);
    border: none; color: rgba(255,255,255,0.5);
    font-size: 13px; cursor: pointer;
    transition: background 0.2s, color 0.2s;
    font-family: inherit;
  }
  .comment-form .submit-btn:hover { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.8); }
  .comment-form .submit-btn:disabled { opacity: 0.3; cursor: default; }

  /* ========== Comment List ========== */
  .comment-list { display: flex; flex-direction: column; gap: 12px; }
  .comment-item {
    padding: 14px 16px; border-radius: 12px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
  }
  .comment-item .meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px; font-size: 11px;
  }
  .comment-item .meta .nickname { color: rgba(255,255,255,0.4); font-weight: 500; }
  .comment-item .meta .time { color: rgba(255,255,255,0.1); }
  .comment-item .text { font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.55; }
  .comment-empty {
    font-size: 13px; color: rgba(255,255,255,0.1);
    text-align: center; padding: 32px 0;
  }
</style>
</head>
<body>

<div class="feedback-widget">
  <div class="divider"></div>

  <!-- 点赞 -->
  <div class="like-area">
    <div class="label">这个页面有帮助吗？</div>
    <button class="like-btn" id="likeBtn">
      <span>👍</span>
      <span class="count" id="likeCount">-</span>
    </button>
  </div>

  <!-- 留言 -->
  <div class="comment-area">
    <div class="section-title">留言</div>
    <div class="comment-form">
      <div class="row">
        <input type="text" id="nicknameInput" placeholder="你的昵称（可选）" maxlength="12">
      </div>
      <textarea id="textInput" placeholder="说说你的想法…"></textarea>
      <button class="submit-btn" id="submitBtn">发送</button>
    </div>
    <div id="commentList" class="comment-list"></div>
  </div>
</div>

<script>
// ============================================================
// 配置 — 部署 Worker 后替换这里的 URL
// ============================================================
const API_BASE = ''; // 同域名，空字符串即可
const PAGE_ID  = 'dorm'; // 不同页面用不同 ID（如 'dorm', 'portal', 'study' 等）

// ============================================================
// 点赞
// ============================================================
async function loadLikes() {
  const res = await fetch(`${API_BASE}/api/likes?page=${PAGE_ID}`);
  const data = await res.json();
  document.getElementById('likeCount').textContent = data.count;
}

async function toggleLike() {
  const btn = document.getElementById('likeBtn');
  btn.classList.toggle('liked');
  // 不论是否 liked 都 +1（可改为 toggle，但简单先用单向）
  const res = await fetch(`${API_BASE}/api/likes`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ page: PAGE_ID }),
  });
  const data = await res.json();
  document.getElementById('likeCount').textContent = data.count;
  localStorage.setItem(`liked_${PAGE_ID}`, '1');
}

// ============================================================
// 留言
// ============================================================
async function loadComments() {
  const res = await fetch(`${API_BASE}/api/comments?page=${PAGE_ID}`);
  const list = await res.json();
  const el = document.getElementById('commentList');
  if (!list || list.length === 0) {
    el.innerHTML = '<div class="comment-empty">还没有留言，来说点什么吧</div>';
    return;
  }
  el.innerHTML = list.map(c => `
    <div class="comment-item">
      <div class="meta">
        <span class="nickname">${esc(c.nickname)}</span>
        <span class="time">${formatTime(c.time)}</span>
      </div>
      <div class="text">${esc(c.text)}</div>
    </div>
  `).join('');
}

async function postComment() {
  const nickname = document.getElementById('nicknameInput').value.trim();
  const text = document.getElementById('textInput').value.trim();
  if (!text) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '发送中…';

  try {
    const res = await fetch(`${API_BASE}/api/comments`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page: PAGE_ID, nickname, text }),
    });
    const list = await res.json();
    document.getElementById('textInput').value = '';
    renderComments(list);
  } catch (e) {
    alert('发送失败，请稍后重试');
  } finally {
    btn.disabled = false;
    btn.textContent = '发送';
  }
}

function renderComments(list) {
  const el = document.getElementById('commentList');
  if (!list || list.length === 0) {
    el.innerHTML = '<div class="comment-empty">还没有留言，来说点什么吧</div>';
    return;
  }
  el.innerHTML = list.map(c => `
    <div class="comment-item">
      <div class="meta">
        <span class="nickname">${esc(c.nickname)}</span>
        <span class="time">${formatTime(c.time)}</span>
      </div>
      <div class="text">${esc(c.text)}</div>
    </div>
  `).join('');
}

// ============================================================
// 工具
// ============================================================
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '匿名';
  return d.innerHTML;
}

function formatTime(iso) {
  try {
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getMonth()+1}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  } catch { return ''; }
}

// ============================================================
// 初始化
// ============================================================
loadLikes();
loadComments();

document.getElementById('likeBtn').addEventListener('click', toggleLike);
document.getElementById('submitBtn').addEventListener('click', postComment);
document.getElementById('textInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) postComment();
});
</script>
</body>
</html>
