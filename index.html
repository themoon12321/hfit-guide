<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合肥理工学院指南</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
    background: #0d0d0f;
    color: #eaeaef;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center;
    padding: 60px 24px 40px;
  }

  /* ========== Hero ========== */
  .hero {
    text-align: center;
    max-width: 640px;
    margin-bottom: 56px;
    animation: fadeUp 0.6s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hero .badge {
    display: inline-block;
    padding: 6px 18px; border-radius: 20px;
    background: rgba(255,255,255,0.07);
    font-size: 12px; letter-spacing: 0.4px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 20px;
  }
  .hero h1 {
    font-size: 40px; font-weight: 650; line-height: 1.22;
    color: #f5f5fa; letter-spacing: -0.3px;
    margin-bottom: 14px;
  }
  .hero p {
    font-size: 16px; color: rgba(255,255,255,0.45);
    line-height: 1.7;
  }

  /* ========== Grid ========== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    max-width: 900px;
    width: 100%;
    margin-bottom: 56px;
  }
  .card {
    position: relative;
    padding: 32px 28px;
    border-radius: 20px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    transition: background 0.3s, border-color 0.3s, transform 0.25s;
    text-decoration: none; color: inherit;
    display: flex; flex-direction: column;
  }
  .card.ready { cursor: pointer; }
  .card.ready:hover {
    background: rgba(255,255,255,0.07);
    border-color: rgba(255,255,255,0.12);
    transform: translateY(-3px);
  }
  .card.ready:active { transform: translateY(-1px); }
  .card .icon {
    font-size: 32px; margin-bottom: 16px;
    width: 48px; height: 48px; border-radius: 14px;
    background: rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
  }
  .card h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #f0f0f5; }
  .card p { font-size: 13px; color: rgba(255,255,255,0.4); line-height: 1.6; flex: 1; }
  .card .action {
    margin-top: 18px;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,0.3);
    transition: color 0.25s;
  }
  .card.ready .action { color: rgba(255,255,255,0.6); }
  .card.ready:hover .action { color: rgba(255,255,255,0.9); }
  .card .coming-tag {
    position: absolute; top: 16px; right: 16px;
    padding: 3px 12px; border-radius: 12px;
    background: rgba(255,255,255,0.05);
    font-size: 11px; color: rgba(255,255,255,0.25);
  }
  .card.disabled { opacity: 0.5; }
  .card.disabled .coming-tag { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.2); }

  /* ========== Footer ========== */
  .footer {
    text-align: center;
    padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.06);
    max-width: 640px; width: 100%;
  }
  .footer a {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 7px 18px; border-radius: 18px;
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.4);
    font-size: 12px; text-decoration: none;
    transition: background 0.2s, color 0.2s;
  }
  .footer a:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); }
  .footer .credit {
    margin-top: 14px;
    font-size: 13px; color: rgba(255,255,255,0.2);
  }

  /* ========== Responsive ========== */
  @media (max-width: 640px) {
    body { padding: 40px 16px 32px; }
    .hero h1 { font-size: 28px; }
    .hero { margin-bottom: 40px; }
    .grid { grid-template-columns: 1fr; gap: 14px; }
    .card { padding: 24px 20px; }
    .card .icon { width: 40px; height: 40px; font-size: 26px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="badge">🎓 新生指南</div>
  <h1>合肥理工学院指南</h1>
  <p>从宿舍到教室，从食堂到图书馆——<br>你想知道的，都在这里。</p>
</div>

<div class="grid" id="cardGrid"></div>

<div class="footer">
  <a href="about.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    关于我
  </a>
  <div class="credit">@月亮早睡困不醒 · Made with 🌙 2026</div>
</div>

<script>
const MODULES = [
  {
    icon: '🏠',
    title: '宿舍尺寸指南',
    desc: '床有多宽？书桌能放多大显示器？衣柜能挂多长的衣服？提前了解宿舍各处的实际尺寸，买对东西不踩坑。',
    path: 'dorm/index.html',
    status: 'ready',
    tag: '16 张示意图'
  },
  {
    icon: '📚',
    title: '学习指南',
    desc: '教学楼分布、自习室、选课攻略……',
    status: 'coming-soon'
  },
  {
    icon: '🏫',
    title: '校园指南',
    desc: '食堂、快递、运动场所、周边交通……',
    status: 'coming-soon'
  }
];

const grid = document.getElementById('cardGrid');

MODULES.forEach(m => {
  const card = document.createElement('a');
  card.className = 'card' + (m.status === 'ready' ? ' ready' : ' disabled');

  if (m.status === 'ready') {
    card.href = m.path;
  } else {
    card.href = 'javascript:void(0)';
    card.addEventListener('click', (e) => e.preventDefault());
  }

  const tagHtml = m.status !== 'ready' ? '<span class="coming-tag">即将上线</span>' :
    (m.tag ? '<span class="coming-tag">' + m.tag + '</span>' : '');

  card.innerHTML = `
    <div class="icon">${m.icon}</div>
    <h2>${m.title}</h2>
    <p>${m.desc}</p>
    <span class="action">${m.status === 'ready' ? '开始浏览 →' : '即将推出'}</span>
    ${tagHtml}
  `;

  grid.appendChild(card);
});
</script>
</body>
</html>
