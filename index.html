<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宿舍尺寸指南 — XX 校区</title>
<style>
  /* ========== Reset + Base ========== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
    background: #131314;
    color: #e8e8ed;
    -webkit-font-smoothing: antialiased;
  }
  button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }

  /* ========== Welcome Screen ========== */
  #welcome {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #131314;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  #welcome::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 40%, rgba(255,255,255,0.03) 0%, transparent 100%);
    pointer-events: none;
  }
  #welcome.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .welcome-card {
    position: relative; text-align: center;
    max-width: 560px; padding: 64px 48px;
    animation: fadeUp 0.8s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .welcome-card .badge {
    display: inline-block;
    padding: 5px 16px; border-radius: 16px;
    background: rgba(255,255,255,0.06);
    font-size: 12px; letter-spacing: 0.4px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 24px;
  }
  .welcome-card h1 { font-size: 40px; font-weight: 600; margin-bottom: 16px; line-height: 1.25; color: #f0f0f5; }
  .welcome-card p  { font-size: 16px; color: rgba(255,255,255,0.5); line-height: 1.7; margin-bottom: 36px; }
  .welcome-card .highlight { color: rgba(255,255,255,0.75); }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 36px; border-radius: 24px;
    background: #f0f0f5; color: #131314;
    font-size: 16px; font-weight: 600;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .btn-primary:hover { transform: scale(1.03); background: #fff; }
  .btn-primary:active { transform: scale(0.97); }
  .welcome-card .footer-note {
    margin-top: 28px; font-size: 12px; color: rgba(255,255,255,0.25);
  }

  /* ========== Gallery ========== */
  #gallery {
    position: fixed; inset: 0; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    background: #131314;
  }
  .image-wrapper {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .image-wrapper img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
    transition: opacity 0.25s ease;
    padding: 16px;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* ========== Top Bar ========== */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    pointer-events: none;
  }
  .top-bar > * { pointer-events: auto; }
  .top-bar .counter {
    font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,0.45);
  }

  /* ========== Nav Arrows ========== */
  .nav-btn {
    position: fixed; top: 50%; transform: translateY(-50%); z-index: 15;
    width: 44px; height: 44px; border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.55);
    font-size: 18px;
    transition: background 0.2s, color 0.2s;
    margin: 0 8px;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.85); }
  .nav-btn:active { background: rgba(255,255,255,0.18); }
  .nav-btn.prev { left: 0; }
  .nav-btn.next { right: 0; }

  /* ========== Bottom Bar ========== */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    gap: 12px;
  }
  .bottom-bar .title {
    font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,0.55);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1;
  }

  /* ========== Toggle ========== */
  .toggle-annotations {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 20px;
    background: rgba(255,255,255,0.05);
    font-size: 12px; font-weight: 500;
    color: rgba(255,255,255,0.35);
    transition: background 0.3s, color 0.3s;
    flex-shrink: 0;
  }
  .toggle-annotations:hover { background: rgba(255,255,255,0.08); }
  .toggle-annotations.active {
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.85);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  }
  .toggle-track {
    position: relative; width: 32px; height: 18px; border-radius: 10px;
    background: rgba(255,255,255,0.1);
    transition: background 0.3s;
  }
  .toggle-annotations.active .toggle-track { background: rgba(255,255,255,0.5); }
  .toggle-thumb {
    position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: rgba(255,255,255,0.6);
    transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1), background 0.3s;
  }
  .toggle-annotations.active .toggle-thumb {
    transform: translateX(14px);
    background: #fff;
  }

  /* ========== Zoom Toggle ========== */
  .toggle-zoom {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 20px;
    background: rgba(255,255,255,0.06);
    font-size: 12px; font-weight: 500;
    color: rgba(255,255,255,0.45);
    transition: background 0.3s, color 0.3s;
    flex-shrink: 0;
  }
  .toggle-zoom:hover { background: rgba(255,255,255,0.1); }
  .toggle-zoom.active { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.8); }
  .toggle-zoom .toggle-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    transition: background 0.3s;
  }
  .toggle-zoom.active .toggle-dot { background: rgba(255,255,255,0.7); }

  /* ========== Zoomed image wrapper ========== */
  .image-wrapper.zooming { cursor: grab; }
  .image-wrapper.zooming:active { cursor: grabbing; }
  .image-wrapper.zooming img { transition: none; }

  /* ========== Back to Home ========== */
  .btn-home {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 14px; border-radius: 18px;
    background: rgba(255,255,255,0.06);
    font-size: 12px; color: rgba(255,255,255,0.45);
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .btn-home:hover { background: rgba(255,255,255,0.1); }

  /* ========== Loading Spinner ========== */
  .spinner {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 28px; height: 28px; border: 2px solid rgba(255,255,255,0.08);
    border-top-color: rgba(255,255,255,0.35); border-radius: 50%;
    animation: spin 0.7s linear infinite;
    z-index: 5;
  }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  /* ========== Toast ========== */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 30;
    padding: 10px 24px; border-radius: 40px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    font-size: 13px; color: rgba(255,255,255,0.8);
    opacity: 0; transition: opacity 0.4s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ========== Responsive ========== */
  @media (max-width: 640px) {
    .welcome-card { padding: 40px 28px; }
    .welcome-card h1 { font-size: 28px; }
    .nav-btn { width: 38px; height: 38px; font-size: 16px; margin: 0 4px; }
    .bottom-bar { padding: 12px 14px; flex-wrap: wrap; }
    .bottom-bar .title { font-size: 12px; flex-basis: 100%; order: -1; text-align: center; }
    .top-bar { padding: 12px 14px; }
    .image-wrapper img { padding: 8px; }
    .toggle-annotations { padding: 5px 12px; font-size: 11px; }
    .toggle-zoom { padding: 5px 12px; font-size: 11px; }
    .btn-home { padding: 5px 12px; font-size: 11px; }
  }
</style>
</head>
<body>

<!-- ==================== Welcome ==================== -->
<div id="welcome">
  <div class="welcome-card">
    <div class="badge">🏠 新生指南</div>
    <h1>合肥理工学院<br>宿舍尺寸指南</h1>
    <p>
      床有多宽？书桌能放多大显示器？衣柜能挂多长的衣服？<br>
      提前了解宿舍各处的<span class="highlight">实际尺寸</span>，买对东西不踩坑。
    </p>
    <p style="font-size:13px;color:rgba(255,255,255,0.4);margin-top:-16px;margin-bottom:24px;">
      ⚠️ 所有尺寸均为手工测量，实际可能有所出入，仅供参考。<br>对尺寸精度要求较高的部件，建议开学后自行复测。
    </p>
    <button class="btn-primary" id="btnEnter">
      <span>开始浏览</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
    <div class="footer-note" id="footerNote">
      共 16 张示意图 · 均含尺寸标注
    </div>
    <div class="footer-note" style="margin-top:6px;font-size:12px;color:rgba(255,255,255,0.25);">
      by 月亮早睡困不醒
    </div>
  </div>
</div>

<!-- ==================== Gallery ==================== -->
<div id="gallery">
  <div class="image-wrapper" id="imageWrapper">
    <div class="spinner" id="spinner" style="display:none;"></div>
    <img id="mainImage" src="" alt="宿舍尺寸示意图">
  </div>
</div>

<!-- Top Bar -->
<div class="top-bar">
  <button class="btn-home" id="btnHome">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    首页
  </button>
  <span class="counter" id="counter">1 / 16</span>
</div>

<!-- Nav Buttons -->
<button class="nav-btn prev" id="btnPrev" aria-label="上一张">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
</button>
<button class="nav-btn next" id="btnNext" aria-label="下一张">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
</button>

<!-- Bottom Bar -->
<div class="bottom-bar">
  <span class="title" id="imageTitle">正在加载…</span>
  <button class="toggle-annotations" id="toggleBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    <div class="toggle-track"><div class="toggle-thumb"></div></div>
    <span id="toggleLabel">标注</span>
  </button>
  <button class="toggle-zoom" id="zoomBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></svg>
    <div class="toggle-dot"></div>
    <span id="zoomLabel">缩放</span>
  </button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
//  Data
// ============================================================
const RAW_DIR    = 'img/raw';
const ANNOT_DIR  = 'img/ann';

// id pattern: D=书桌 B=床 S=楼梯 C=衣柜 P=空间示意
const IMAGES = [
  { id: 'D01', ann: true, cat: 'desk',  label: '书桌 — 主正视图' },
  { id: 'D02', ann: true, cat: 'desk',  label: '书桌下方 — 带柜完整视图' },
  { id: 'D03', ann: true, cat: 'desk',  label: '书桌下方 — 正视图' },
  { id: 'D07', ann: true, cat: 'desk',  label: '书桌右下 — 两层小柜图' },
  { id: 'D09', ann: true, cat: 'desk',  label: '书桌 — 正面后挡板视图' },
  { id: 'D10', ann: true, cat: 'desk',  label: '书桌 — 线缆开口直径图' },
  { id: 'B01', ann: true, cat: 'bed',   label: '床板 — 视图' },
  { id: 'B02', ann: true, cat: 'bed',   label: '床板 — 层高视图' },
  { id: 'S01', ann: true, cat: 'stairs', label: '楼梯斜视图' },
  { id: 'S02', ann: true, cat: 'stairs', label: '楼梯柜视图一' },
  { id: 'C01', ann: true, cat: 'closet', label: '衣柜 — 闭门视图' },
  { id: 'C02', ann: true, cat: 'closet', label: '衣柜上层开门视图' },
  { id: 'C03', ann: true, cat: 'closet', label: '衣柜下方开门视图' },
  { id: 'C04', ann: true, cat: 'closet', label: '衣柜顶部缝隙视图' },
  { id: 'P01', ann: true, cat: 'space', label: '一四号床位 — 侧边空间示意图' },
  { id: 'P02', ann: true, cat: 'space', label: '二三号床位 — 侧边空间示意图' },
];

// Derive file path from id
function fileFor(id) { return id + '.jpg'; }

// ============================================================
//  State
// ============================================================
let currentIndex   = 0;
let showAnnotations = true;  // 默认显示标注版
let filteredIndices = IMAGES.map((_, i) => i);

// Background preload
const PRELOAD_AHEAD = 3;     // 只预加载前方3张
let preloadQueue = [];
let preloading   = false;
let preloadInterval = 200;
let loadToken    = 0;        // 请求令牌，丢掉过期的图片加载
const cached = {};  // key: "idx_raw" or "idx_ann"

// ============================================================
//  DOM refs
// ============================================================
const elImg      = document.getElementById('mainImage');
const elSpinner  = document.getElementById('spinner');
const elCounter  = document.getElementById('counter');
const elTitle    = document.getElementById('imageTitle');
const elToggle   = document.getElementById('toggleBtn');
const elToggleLbl = document.getElementById('toggleLabel');

// ============================================================
//  Helpers
// ============================================================
function getImagePath(index) {
  const meta = IMAGES[index];
  const fn = fileFor(meta.id);
  if (!showAnnotations || !meta.ann) return `${RAW_DIR}/${fn}`;
  return `${ANNOT_DIR}/${fn}`;
}

function updateImage() {
  const realIdx = filteredIndices[currentIndex];
  if (realIdx === undefined) return;
  const token = ++loadToken;

  const src = getImagePath(realIdx);
  const meta = IMAGES[realIdx];
  const cacheKey = realIdx + (showAnnotations ? '_ann' : '_raw');

  elCounter.textContent = `${currentIndex + 1} / ${filteredIndices.length}`;
  elTitle.textContent   = `${meta.id} ${meta.label}`;
  elToggle.classList.toggle('active', showAnnotations);
  elToggleLbl.textContent = showAnnotations ? '隐藏标注' : '显示标注';

  // 总是先重置缩放
  resetZoom();

  // 缓存命中
  if (cached[cacheKey]) {
    if (token !== loadToken) return;
    elImg.src = src;
    elSpinner.style.display = 'none';
    startBackgroundPreload();
    return;
  }

  // 延迟 200ms 再显示 spinner，避免快图闪一下
  let spinnerTimer = setTimeout(() => {
    if (token === loadToken) elSpinner.style.display = 'block';
  }, 200);

  const preloader = new Image();
  preloader.onload = () => {
    clearTimeout(spinnerTimer);
    if (token !== loadToken) return;
    cached[cacheKey] = true;
    elImg.src = src;
    elSpinner.style.display = 'none';
    startBackgroundPreload();
  };
  preloader.onerror = () => {
    clearTimeout(spinnerTimer);
    if (token !== loadToken) return;
    if (showAnnotations && meta.ann) {
      elImg.src = `${RAW_DIR}/${fileFor(meta.id)}`;
      showToast('⚠️ 该图暂未标注，显示原图');
    }
    elSpinner.style.display = 'none';
  };
  preloader.src = src;
}

// ============================================================
//  Background preloader
// ============================================================
function startBackgroundPreload() {
  preloadQueue = [];

  for (let i = 1; i <= PRELOAD_AHEAD; i++) {
    const idx = (currentIndex + i) % filteredIndices.length;
    if (idx === currentIndex) continue;
    const realIdx = filteredIndices[idx];
    if (realIdx === undefined) continue;
    const meta = IMAGES[realIdx];
    const rawKey = realIdx + '_raw';
    const annKey = realIdx + '_ann';
    if (!cached[rawKey])  preloadQueue.push({ idx: realIdx, key: rawKey,  mode: 'raw' });
    if (meta.ann && !cached[annKey]) preloadQueue.push({ idx: realIdx, key: annKey, mode: 'ann' });
  }

  const isSlow = navigator.connection
    && (navigator.connection.saveData || navigator.connection.effectiveType === 'slow-2g' || navigator.connection.effectiveType === '2g' || navigator.connection.effectiveType === '3g');
  preloadInterval = isSlow ? 800 : 200;

  if (!preloading) {
    preloading = true;
    processQueue();
  }
}

function processQueue() {
  if (preloadQueue.length === 0) { preloading = false; return; }
  const item = preloadQueue.shift();
  const meta = IMAGES[item.idx];
  const url = item.mode === 'raw'
    ? `${RAW_DIR}/${fileFor(meta.id)}`
    : `${ANNOT_DIR}/${fileFor(meta.id)}`;
  const loader = new Image();
  loader.onload = loader.onerror = () => { cached[item.key] = true; };
  loader.src = url;
  setTimeout(processQueue, preloadInterval);
}

function navigate(delta) {
  if (filteredIndices.length === 0) return;
  currentIndex = (currentIndex + delta + filteredIndices.length) % filteredIndices.length;
  updateImage();
}

function nextImage() { navigate(1); }
function prevImage() { navigate(-1); }

// ============================================================
//  Toggle Annotations
// ============================================================
function toggleAnnotations() {
  showAnnotations = !showAnnotations;
  const realIdx = filteredIndices[currentIndex];
  const cacheKey = realIdx + (showAnnotations ? '_ann' : '_raw');

  elToggle.classList.toggle('active', showAnnotations);
  elToggleLbl.textContent = showAnnotations ? '隐藏标注' : '显示标注';

  if (cached[cacheKey]) {
    resetZoom();
    elImg.src = getImagePath(realIdx);
    startBackgroundPreload();
  } else {
    updateImage();
  }
}

// ============================================================
//  Zoom
// ============================================================
let zoomEnabled = false;
let zoomScale  = 1;
let zoomX = 0, zoomY = 0;
let panning = false, panStartX = 0, panStartY = 0, panOrgX = 0, panOrgY = 0;

const elZoom    = document.getElementById('zoomBtn');
const elZoomLbl = document.getElementById('zoomLabel');
const elWrapper = document.getElementById('imageWrapper');

function toggleZoom() {
  zoomEnabled = !zoomEnabled;
  elZoom.classList.toggle('active', zoomEnabled);
  elZoomLbl.textContent = zoomEnabled ? '缩放' : '缩放';
  elWrapper.classList.toggle('zooming', zoomEnabled);
  if (!zoomEnabled) resetZoom();
}

function resetZoom() {
  zoomScale = 1; zoomX = 0; zoomY = 0;
  applyZoom();
}

function applyZoom() {
  elImg.style.transform = `translate(${zoomX}px,${zoomY}px) scale(${zoomScale})`;
  elImg.style.transformOrigin = '0 0';
}

elWrapper.addEventListener('wheel', (e) => {
  if (!zoomEnabled) return;
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.min(5, Math.max(1, zoomScale * delta));
  // Zoom toward cursor
  const rect = elImg.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  zoomX = zoomX - cx * (newScale - zoomScale) / zoomScale;
  zoomY = zoomY - cy * (newScale - zoomScale) / zoomScale;
  zoomScale = newScale;
  applyZoom();
}, { passive: false });

elWrapper.addEventListener('pointerdown', (e) => {
  if (!zoomEnabled) return;
  panning = true;
  panStartX = e.clientX; panStartY = e.clientY;
  panOrgX = zoomX; panOrgY = zoomY;
  elWrapper.setPointerCapture(e.pointerId);
});
elWrapper.addEventListener('pointermove', (e) => {
  if (!panning) return;
  zoomX = panOrgX + (e.clientX - panStartX);
  zoomY = panOrgY + (e.clientY - panStartY);
  applyZoom();
});
elWrapper.addEventListener('pointerup', () => { panning = false; });

// Double-click to toggle 1x ↔ 2x
elWrapper.addEventListener('dblclick', (e) => {
  if (!zoomEnabled) return;
  zoomScale = zoomScale > 1.5 ? 1 : 2;
  applyZoom();
});

// ============================================================
//  Welcome → Gallery
// ============================================================
function enterGallery() {
  document.getElementById('welcome').classList.add('hidden');
  currentIndex = 0;
  filteredIndices = IMAGES.map((_, i) => i);
  updateImage();
}

function goHome() {
  document.getElementById('welcome').classList.remove('hidden');
}

// ============================================================
//  Toast
// ============================================================
let toastTimeout;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove('show'), 2500);
}

// ============================================================
//  Keyboard
// ============================================================
document.addEventListener('keydown', (e) => {
  // ignore when welcome is visible
  if (!document.getElementById('welcome').classList.contains('hidden')) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enterGallery(); }
    return;
  }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); prevImage(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); nextImage(); }
  if (e.key === 'Escape')     { goHome(); }
  if (e.key === 'a' || e.key === 'A') { toggleAnnotations(); }
});

// ============================================================
//  Touch swipe
// ============================================================
let touchStartX = 0;
document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
document.addEventListener('touchend', (e) => {
  const diff = touchStartX - e.changedTouches[0].screenX;
  if (Math.abs(diff) > 60) {
    diff > 0 ? nextImage() : prevImage();
  }
});

// ============================================================
//  Init — preload onto welcome screen background
// ============================================================
// ============================================================
//  Event Listeners
// ============================================================
document.getElementById('btnEnter').addEventListener('click', enterGallery);
document.getElementById('btnPrev').addEventListener('click', prevImage);
document.getElementById('btnNext').addEventListener('click', nextImage);
document.getElementById('btnHome').addEventListener('click', goHome);
document.getElementById('toggleBtn').addEventListener('click', toggleAnnotations);
document.getElementById('zoomBtn').addEventListener('click', toggleZoom);

console.log('🏠 宿舍尺寸指南 loaded — 共 ' + IMAGES.length + ' 张图片，' + IMAGES.filter(i => i.ann).length + ' 张已标注');
document.getElementById('footerNote').textContent =
  '共 ' + IMAGES.length + ' 张示意图 · 均含尺寸标注';
</script>
</body>
</html>
