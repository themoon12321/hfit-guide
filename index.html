<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合肥理工学院指南</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
    background: #0d0d0f;
    color: #eaeaef;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center;
    padding: 60px 24px 40px;
  }

  /* ========== Hero ========== */
  .hero {
    text-align: center;
    max-width: 640px;
    margin-bottom: 56px;
    animation: fadeUp 0.6s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hero .badge {
    display: inline-block;
    padding: 6px 18px; border-radius: 20px;
    background: rgba(255,255,255,0.07);
    font-size: 12px; letter-spacing: 0.4px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 20px;
  }
  .hero h1 {
    font-size: 40px; font-weight: 650; line-height: 1.22;
    color: #f5f5fa; letter-spacing: -0.3px;
    margin-bottom: 14px;
  }
  .hero p {
    font-size: 16px; color: rgba(255,255,255,0.45);
    line-height: 1.7;
  }

  /* ========== Grid ========== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    max-width: 900px;
    width: 100%;
    margin-bottom: 56px;
  }
  .card {
    position: relative;
    padding: 32px 28px;
    border-radius: 20px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    transition: background 0.3s, border-color 0.3s, transform 0.25s;
    text-decoration: none; color: inherit;
    display: flex; flex-direction: column;
  }
  .card.ready { cursor: pointer; }
  .card.ready:hover {
    background: rgba(255,255,255,0.07);
    border-color: rgba(255,255,255,0.12);
    transform: translateY(-3px);
  }
  .card.ready:active { transform: translateY(-1px); }
  .card .icon {
    font-size: 32px; margin-bottom: 16px;
    width: 48px; height: 48px; border-radius: 14px;
    background: rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
  }
  .card h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #f0f0f5; }
  .card p { font-size: 13px; color: rgba(255,255,255,0.4); line-height: 1.6; flex: 1; }
  .card .action {
    margin-top: 18px;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,0.3);
    transition: color 0.25s;
  }
  .card.ready .action { color: rgba(255,255,255,0.6); }
  .card.ready:hover .action { color: rgba(255,255,255,0.9); }
  .card .coming-tag {
    position: absolute; top: 16px; right: 16px;
    padding: 3px 12px; border-radius: 12px;
    background: rgba(255,255,255,0.05);
    font-size: 11px; color: rgba(255,255,255,0.25);
  }
  .card.disabled { opacity: 0.5; }
  .card.disabled .coming-tag { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.2); }

  /* ========== Footer ========== */
  .footer {
    text-align: center;
    padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.06);
    max-width: 640px; width: 100%;
  }
  .footer a {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 7px 18px; border-radius: 18px;
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.4);
    font-size: 12px; text-decoration: none;
    transition: background 0.2s, color 0.2s;
  }
  .footer a:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); }
  .footer .credit {
    margin-top: 14px;
    font-size: 13px; color: rgba(255,255,255,0.2);
  }

  /* ========== Responsive ========== */
  @media (max-width: 640px) {
    body { padding: 40px 16px 32px; }
    .hero h1 { font-size: 28px; }
    .hero { margin-bottom: 40px; }
    .grid { grid-template-columns: 1fr; gap: 14px; }
    .card { padding: 24px 20px; }
    .card .icon { width: 40px; height: 40px; font-size: 26px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="badge">🎓 新生指南</div>
  <h1>合肥理工学院指南</h1>
  <p>从宿舍到教室，从食堂到图书馆——<br>你想知道的，都在这里。</p>
</div>

<div class="grid" id="cardGrid"></div>

<div class="footer">
  <a href="about.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    关于我
  </a>
  <div class="credit" id="credit" style="cursor:default">@月亮早睡困不醒 · Made with 🌙 2026</div>
</div>

<!-- ========== Feedback Widget ========== -->
<div class="feedback">
  <!-- 点赞 -->
  <div class="fb-like">
    <span class="fb-label">这个页面有帮助吗？</span>
    <button class="fb-like-btn" id="fbLikeBtn">
      <span>👍</span>
      <span class="fb-count" id="fbLikeCount">-</span>
    </button>
  </div>

  <!-- 留言 -->
  <div class="fb-comments">
    <div class="fb-c-title">有什么想说的？</div>
    <div class="fb-form">
      <textarea id="fbText" placeholder="反馈、建议、或者单纯打个招呼…"></textarea>
      <button class="fb-submit" id="fbSubmit">发送</button>
    </div>
    <div id="fbMyComments"></div>
  </div>
</div>

<style>
/* ========== Feedback Widget ========== */
.feedback {
  width: 100%; max-width: 640px; margin-top: 48px;
  padding-top: 32px; border-top: 1px solid rgba(255,255,255,0.06);
}
.fb-like { margin-bottom: 36px; }
.fb-label { font-size: 13px; color: rgba(255,255,255,0.3); margin-bottom: 12px; }
.fb-like-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 22px; border-radius: 22px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.4); font-size: 14px; cursor: pointer;
  transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
  font-family: inherit;
}
.fb-like-btn:hover {
  background: rgba(255,255,255,0.07);
  border-color: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7);
}
.fb-like-btn:active { transform: scale(0.95); }
.fb-like-btn .fb-count {
  font-size: 13px; font-feature-settings: "tnum";
  color: rgba(255,255,255,0.2); min-width: 14px;
}
.fb-like-btn.liked { background: rgba(80,200,120,0.12); border-color: rgba(80,200,120,0.25); color: #4cd964; }
.fb-like-btn.liked .fb-count { color: #4cd964; }
.fb-like-btn.liked:hover { background: rgba(80,200,120,0.18); border-color: rgba(80,200,120,0.35); }

.fb-c-title { font-size: 13px; color: rgba(255,255,255,0.3); margin-bottom: 12px; margin-top: 8px; }
.fb-my-item {
  padding: 10px 14px; border-radius: 10px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.55;
  margin-top: 10px;
}
.fb-my-item .fb-my-time {
  font-size: 11px; color: rgba(255,255,255,0.12);
  margin-top: 4px;
}
.fb-form { display: flex; flex-direction: column; gap: 10px; }
.fb-form textarea {
  padding: 10px 14px; border-radius: 10px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  color: #eaeaef; font-size: 13px;
  font-family: inherit; outline: none;
  transition: border-color 0.2s;
}
.fb-form input::placeholder, .fb-form textarea::placeholder { color: rgba(255,255,255,0.15); }
.fb-form input:focus, .fb-form textarea:focus { border-color: rgba(255,255,255,0.15); }
.fb-form textarea { min-height: 64px; resize: vertical; }
.fb-submit {
  align-self: flex-end;
  padding: 8px 20px; border-radius: 10px;
  background: rgba(255,255,255,0.08);
  border: none; color: rgba(255,255,255,0.5); font-size: 13px;
  cursor: pointer; transition: background 0.2s, color 0.2s;
  font-family: inherit;
}
.fb-submit:hover { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.8); }
.fb-submit:disabled { opacity: 0.3; cursor: default; }

</style>

<script>
// ========== Feedback API ==========
const PAGE_ID = 'portal';

async function loadLikes() {
  const r = await fetch('/api/likes?page=' + PAGE_ID);
  const d = await r.json();
  document.getElementById('fbLikeCount').textContent = d.count;
}

document.getElementById('fbLikeBtn').addEventListener('click', async function() {
  const liked = this.classList.toggle('liked');
  localStorage.setItem('liked_portal', liked ? '1' : '0');
  const r = await fetch('/api/likes', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({page: PAGE_ID, delta: liked ? 1 : -1}) });
  const d = await r.json();
  document.getElementById('fbLikeCount').textContent = d.count;
});

// 初始化时恢复点赞状态
if (localStorage.getItem('liked_portal') === '1') {
  document.getElementById('fbLikeBtn').classList.add('liked');
}

// 显示自己发过的留言
function showMyComments() {
  const el = document.getElementById('fbMyComments');
  const saved = JSON.parse(localStorage.getItem('my_comments') || '[]');
  if (!saved.length) { el.innerHTML = ''; return; }
  el.innerHTML = saved.reverse().map(c =>
    '<div class="fb-my-item">' + esc(c.text) + '<div class="fb-my-time">' + c.time + '</div></div>'
  ).join('');
}
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

document.getElementById('fbSubmit').addEventListener('click', async function() {
  const text = document.getElementById('fbText').value.trim();
  if (!text) return;
  this.disabled = true; this.textContent = '发送中…';
  try {
    await fetch('/api/comments', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({page:PAGE_ID, text}) });
    document.getElementById('fbText').value = '';
    this.textContent = '已收到 🎉';
    // 存本地
    const saved = JSON.parse(localStorage.getItem('my_comments') || '[]');
    saved.push({ text, time: new Date().toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) });
    if (saved.length > 10) saved.splice(0, saved.length - 10);
    localStorage.setItem('my_comments', JSON.stringify(saved));
    showMyComments();
  } catch(e) { this.textContent = '发送失败'; }
  finally { setTimeout(() => { this.disabled = false; this.textContent = '发送'; }, 2000); }
});

showMyComments();
    el.innerHTML = list.map(c => '<div class="fb-item"><div class="fb-meta"><span class="name">' + esc(c.nickname) + '</span><span class="time">' + fmt(c.time) + '</span></div><div class="fb-text">' + esc(c.text) + '</div></div>').join('');
  } catch(e) { alert('发送失败'); }
  finally { this.disabled = false; this.textContent = '发送'; }
});

loadLikes();

// 连点 5 下作者名进入管理后台
let clickCount = 0, clickTimer;
document.getElementById('credit').addEventListener('click', () => {
  clickCount++;
  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { clickCount = 0; }, 600);
  if (clickCount >= 5) {
    clickCount = 0;
    window.location.href = '/admin.html';
  }
});
</script>

<script>
const MODULES = [
  {
    icon: '🏠',
    title: '宿舍尺寸指南',
    desc: '床有多宽？书桌能放多大显示器？提前了解宿舍各处的实际尺寸，买对东西不踩坑。',
    path: 'dorm/index.html',
    status: 'ready',
    tag: '16 张示意图'
  },
  {
    icon: '🛋️',
    title: '宿舍布置参考',
    desc: '看看学长学姐们是怎么布置宿舍的——收纳、装饰、布局灵感。',
    path: 'layouts/index.html',
    status: 'ready',
    tag: '布置灵感'
  }
];

const grid = document.getElementById('cardGrid');

MODULES.forEach(m => {
  const card = document.createElement('a');
  card.className = 'card' + (m.status === 'ready' ? ' ready' : ' disabled');

  if (m.status === 'ready') {
    card.href = m.path;
  } else {
    card.href = 'javascript:void(0)';
    card.addEventListener('click', (e) => e.preventDefault());
  }

  const tagHtml = m.status !== 'ready' ? '<span class="coming-tag">即将上线</span>' :
    (m.tag ? '<span class="coming-tag">' + m.tag + '</span>' : '');

  card.innerHTML = `
    <div class="icon">${m.icon}</div>
    <h2>${m.title}</h2>
    <p>${m.desc}</p>
    <span class="action">${m.status === 'ready' ? '开始浏览 →' : '即将推出'}</span>
    ${tagHtml}
  `;

  grid.appendChild(card);
});
</script>
</body>
</html>
