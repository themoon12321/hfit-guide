<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宿舍尺寸指南 — XX 校区</title>
<style>
  /* ========== Reset + Base ========== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
    background: #0d0d0f;
    color: #eaeaef;
    -webkit-font-smoothing: antialiased;
  }
  button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }

  /* ========== Welcome Screen ========== */
  #welcome {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0d0d0f;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  #welcome::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 35%, rgba(255,255,255,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 25% 70%, rgba(255,255,255,0.02) 0%, transparent 50%);
    pointer-events: none;
  }
  #welcome.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .welcome-card {
    position: relative; text-align: center;
    max-width: 600px; padding: 80px 48px;
    animation: fadeUp 0.6s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .welcome-card .badge {
    display: inline-block;
    padding: 6px 18px; border-radius: 20px;
    background: rgba(255,255,255,0.07);
    font-size: 13px; letter-spacing: 0.6px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 28px;
  }
  .welcome-card h1 { font-size: 44px; font-weight: 650; margin-bottom: 20px; line-height: 1.22; color: #f5f5fa; letter-spacing: -0.3px; }
  .welcome-card p  { font-size: 17px; color: rgba(255,255,255,0.45); line-height: 1.7; margin-bottom: 40px; }
  .welcome-card .highlight { color: rgba(255,255,255,0.75); font-weight: 500; }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 15px 40px; border-radius: 28px;
    background: #f5f5fa; color: #0d0d0f;
    font-size: 17px; font-weight: 620;
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .btn-primary:hover { transform: scale(1.03); background: #fff; box-shadow: 0 2px 16px rgba(0,0,0,0.5); }
  .btn-primary:active { transform: scale(0.97); }
  .welcome-card .footer-note {
    margin-top: 32px; font-size: 13px; color: rgba(255,255,255,0.2);
  }

  /* ========== Gallery ========== */
  #gallery {
    position: fixed; inset: 0; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    background: #0d0d0f;
  }
  .image-wrapper {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
    touch-action: pan-x;
    background: #0d0d0f;
  }
  /* skeleton shimmer overlay */
  .image-wrapper::after {
    content: '';
    position: absolute; inset: 0; z-index: 0;
    pointer-events: none;
    background: linear-gradient(100deg,
      transparent 0%,
      transparent 30%,
      rgba(255,255,255,0.03) 35%,
      rgba(255,255,255,0.07) 50%,
      rgba(255,255,255,0.03) 65%,
      transparent 70%,
      transparent 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .image-wrapper.loading::after { opacity: 1; }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .slide-img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    padding: 16px;
    user-select: none;
    -webkit-user-drag: none;
    transition: opacity 0.35s ease;
    opacity: 0;
    z-index: 1;
  }
  .slide-img.active { opacity: 1; }
  /* zoom */
  .image-wrapper.zooming .slide-img { transition: opacity 0.35s ease; }
  .image-wrapper.zooming .slide-img.active { opacity: 1; }
  .image-wrapper.zooming .slide-img:not(.active) { opacity: 0; display: none; }
  .image-wrapper.zooming::after { display: none; }

  /* ========== Top Bar ========== */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    pointer-events: none;
  }
  .top-bar > * { pointer-events: auto; }
  .top-bar .counter {
    font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,0.35);
    font-variant-numeric: tabular-nums;
  }

  /* ========== Nav Arrows ========== */
  .nav-btn {
    position: fixed; top: 50%; transform: translateY(-50%); z-index: 15;
    width: 48px; height: 48px; border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.45);
    font-size: 18px;
    transition: background 0.25s, color 0.25s, transform 0.25s;
    margin: 0 12px;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.85); transform: translateY(-50%) scale(1.05); }
  .nav-btn:active { background: rgba(255,255,255,0.16); transform: translateY(-50%) scale(0.95); }
  .nav-btn.prev { left: 0; }
  .nav-btn.next { right: 0; }

  /* ========== Bottom Bar ========== */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: 16px 20px;
    background: linear-gradient(0deg, rgba(0,0,0,0.5) 0%, transparent 100%);
  }
  .bottom-bar .title {
    font-size: 14px; font-weight: 500;
    color: rgba(255,255,255,0.65);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1;
  }

  /* ========== Toggle ========== */
  .toggle-annotations {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 16px; border-radius: 22px;
    background: rgba(255,255,255,0.04);
    font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,0.3);
    transition: background 0.3s, color 0.3s;
    flex-shrink: 0;
  }
  .toggle-annotations:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.55); }
  .toggle-annotations.active {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.9);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
  }
  .toggle-track {
    position: relative; width: 34px; height: 20px; border-radius: 11px;
    background: rgba(255,255,255,0.08);
    transition: background 0.3s;
  }
  .toggle-annotations.active .toggle-track { background: rgba(255,255,255,0.5); }
  .toggle-thumb {
    position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: rgba(255,255,255,0.5);
    transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1), background 0.3s;
  }
  .toggle-annotations.active .toggle-thumb {
    transform: translateX(14px);
    background: #fff;
  }

  /* ========== Zoom Toggle ========== */
  .toggle-zoom {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 16px; border-radius: 22px;
    background: rgba(255,255,255,0.04);
    font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,0.3);
    transition: background 0.3s, color 0.3s;
    flex-shrink: 0;
  }
  .toggle-zoom:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.55); }
  .toggle-zoom.active {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.9);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
  }
  .toggle-zoom .toggle-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    transition: background 0.3s;
  }
  .toggle-zoom.active .toggle-dot { background: rgba(255,255,255,0.7); }

  /* ========== Zoomed image wrapper ========== */
  .image-wrapper.zooming { cursor: grab; }
  .image-wrapper.zooming:active { cursor: grabbing; }

  /* ========== Hotspot buttons & popups ========== */
  .hotspot-dot {
    position: absolute; z-index: 10;
    width: 28px; height: 28px;
    margin: -14px 0 0 -14px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1.5px solid rgba(255,255,255,0.25);
    cursor: pointer;
    transition: background 0.25s, border-color 0.25s;
    display: flex; align-items: center; justify-content: center;
    animation: hotspotBreathe 2.4s ease-in-out infinite;
  }
  @keyframes hotspotBreathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.25); }
  }
  .hotspot-dot::after {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.6);
    transition: background 0.25s;
  }
  .hotspot-dot:hover {
    background: rgba(255,255,255,0.28);
    border-color: rgba(255,255,255,0.5);
    animation: none;
    transform: scale(1.35);
  }
  .hotspot-dot:hover::after { background: rgba(255,255,255,0.9); }
  .hotspot-bubble {
    position: absolute; z-index: 11;
    width: 260px; max-width: calc(100vw - 40px);
    padding: 18px 20px 16px 20px;
    background: rgba(22,22,26,0.96);
    backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    font-size: 13px; line-height: 1.65; color: rgba(255,255,255,0.75);
    pointer-events: auto;
    box-shadow: 0 16px 48px rgba(0,0,0,0.6), 0 0 0 0.5px rgba(255,255,255,0.04) inset;
    opacity: 0; transform: scale(0);
    transition: opacity 0.22s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    transform-origin: var(--bubble-x) var(--bubble-y);
  }
  .hotspot-bubble.show { opacity: 1; transform: scale(1); }
  .hotspot-bubble .bubble-title {
    font-weight: 600; font-size: 15px; margin-bottom: 8px; padding-right: 20px;
    color: rgba(255,255,255,0.92);
  }
  .hotspot-bubble .bubble-text {
    color: rgba(255,255,255,0.65); line-height: 1.65;
  }
  .hotspot-bubble .bubble-close {
    position: absolute; top: 14px; right: 16px;
    width: 24px; height: 24px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.06);
    font-size: 14px; color: rgba(255,255,255,0.4);
    cursor: pointer; line-height: 1;
    transition: background 0.2s, color 0.2s;
  }
  .hotspot-bubble .bubble-close:hover { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.8); }
  @media (max-width: 640px) {
    .hotspot-dot { width: 24px; height: 24px; margin: -12px 0 0 -12px; }
    .hotspot-dot::after { width: 6px; height: 6px; }
  }

  /* ========== Back to Home ========== */
  .btn-home {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 14px; border-radius: 18px;
    background: rgba(255,255,255,0.06);
    font-size: 12px; color: rgba(255,255,255,0.45);
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .btn-home:hover { background: rgba(255,255,255,0.1); }


  /* ========== Toast ========== */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 30;
    padding: 10px 24px; border-radius: 40px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    font-size: 13px; color: rgba(255,255,255,0.8);
    opacity: 0; transition: opacity 0.4s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ========== Responsive ========== */
  @media (max-width: 640px) {
    .welcome-card { padding: 40px 28px; }
    .welcome-card h1 { font-size: 28px; }
    .nav-btn { width: 38px; height: 38px; font-size: 16px; margin: 0 4px; }
    .bottom-bar { padding: 12px 14px; flex-wrap: wrap; }
    .bottom-bar .title { font-size: 12px; flex-basis: 100%; order: -1; text-align: center; }
    .top-bar { padding: 12px 14px; }
    .slide-img { padding: 8px; }
    .toggle-annotations { padding: 5px 12px; font-size: 11px; }
    .toggle-zoom { padding: 5px 12px; font-size: 11px; }
    .btn-home { padding: 5px 12px; font-size: 11px; }
  }
</style>
</head>
<body>

<!-- ==================== Welcome ==================== -->
<div id="welcome">
  <div class="welcome-card">
    <div class="badge">🏠 新生指南</div>
    <h1>合肥理工学院<br>宿舍尺寸指南</h1>
    <p>
      床有多宽？书桌能放多大显示器？衣柜能挂多长的衣服？<br>
      提前了解宿舍各处的<span class="highlight">实际尺寸</span>，买对东西不踩坑。
    </p>
    <p style="font-size:13px;color:rgba(255,255,255,0.4);margin-top:-16px;margin-bottom:24px;">
      ⚠️ 所有尺寸均为手工测量，实际可能有所出入，仅供参考。<br>对尺寸精度要求较高的部件，建议开学后自行复测。
    </p>
    <button class="btn-primary" id="btnEnter">
      <span>开始浏览</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
    <div class="footer-note" id="footerNote">
      共 16 张示意图 · 均含尺寸标注
    </div>
    <div style="margin-top:40px; width:48px; height:2px; background:rgba(255,255,255,0.15); margin-left:auto;margin-right:auto;border-radius:1px;"></div>
    <div class="footer-note" style="margin-top:14px;font-size:18px;color:rgba(255,255,255,0.35);font-weight:450;letter-spacing:0.3px;">
      @月亮早睡困不醒
    </div>
  </div>
</div>

<!-- ==================== Gallery ==================== -->
<div id="gallery">
  <div class="image-wrapper" id="imageWrapper">

    <img id="imgA" class="slide-img active" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="宿舍尺寸示意图">
    <img id="imgB" class="slide-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
  </div>
</div>

<!-- Top Bar -->
<div class="top-bar">
  <button class="btn-home" id="btnHome">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    首页
  </button>
  <span class="counter" id="counter">1 / 16</span>
</div>

<!-- Nav Buttons -->
<button class="nav-btn prev" id="btnPrev" aria-label="上一张">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
</button>
<button class="nav-btn next" id="btnNext" aria-label="下一张">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
</button>

<!-- Bottom Bar -->
<div class="bottom-bar">
  <span class="title" id="imageTitle">正在加载…</span>
  <button class="toggle-annotations" id="toggleBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    <div class="toggle-track"><div class="toggle-thumb"></div></div>
    <span id="toggleLabel">标注</span>
  </button>
  <button class="toggle-zoom" id="zoomBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></svg>
    <div class="toggle-dot"></div>
    <span id="zoomLabel">缩放</span>
  </button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
//  Data
// ============================================================
const COS_URL    = 'https://hfit-guide-1459922161.cos.ap-nanjing.myqcloud.com';
const RAW_DIR    = COS_URL + '/img/raw';
const ANNOT_DIR  = COS_URL + '/img/ann';

// id pattern: D=书桌 B=床 S=楼梯 C=衣柜 P=空间示意
const IMAGES = [
  { id: 'D01', ann: true, cat: 'desk',  label: '书桌 — 主正视图' },
  { id: 'D02', ann: true, cat: 'desk',  label: '书桌下方 — 带柜完整视图' },
  { id: 'D03', ann: true, cat: 'desk',  label: '书桌下方 — 正视图' },
  { id: 'D07', ann: true, cat: 'desk',  label: '书桌右下 — 两层小柜图' },
  { id: 'D09', ann: true, cat: 'desk',  label: '书桌 — 正面后挡板视图' },
  { id: 'D10', ann: true, cat: 'desk',  label: '书桌 — 线缆开口直径图' },
  { id: 'B01', ann: true, cat: 'bed',   label: '床板 — 视图' },
  { id: 'B02', ann: true, cat: 'bed',   label: '床板 — 层高视图' },
  { id: 'S01', ann: true, cat: 'stairs', label: '楼梯斜视图' },
  { id: 'S02', ann: true, cat: 'stairs', label: '楼梯柜视图一' },
  { id: 'C01', ann: true, cat: 'closet', label: '衣柜 — 闭门视图' },
  { id: 'C02', ann: true, cat: 'closet', label: '衣柜上层开门视图' },
  { id: 'C03', ann: true, cat: 'closet', label: '衣柜下方开门视图' },
  { id: 'C04', ann: true, cat: 'closet', label: '衣柜顶部缝隙视图' },
  { id: 'P01', ann: true, cat: 'space', label: '一四号床位 — 侧边空间示意图' },
  { id: 'P02', ann: true, cat: 'space', label: '二三号床位 — 侧边空间示意图' },
];

// Derive file path from id
function fileFor(id) { return id + '.jpg'; }

// ============================================================
//  Hotspot data (from editor.html)
// ============================================================
const HOTSPOTS = {
  "D01": [
    { x: 28.40, y: 51.39, title: "这里怎么布置？", text: "写写你的心得" },
    { x: 53.23, y: 38.17, title: "书桌收纳建议", text: "写写你的心得" },
  ],
  /* 用 editor.html 标完别的图后，把 JSON 粘到这里 */
};

// ============================================================
//  Render hotspots on current image
// ============================================================
function renderHotspots(imgId) {
  elWrapper.querySelectorAll('.hotspot-dot,.hotspot-bubble').forEach(el => el.remove());

  const spots = HOTSPOTS[imgId];
  if (!spots || spots.length === 0) return;

  spots.forEach((spot, i) => {
    const dot = document.createElement('div');
    dot.className = 'hotspot-dot';
    dot.style.left = spot.x + '%';
    dot.style.top  = spot.y + '%';
    dot.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleBubble(dot, spot, imgId, i);
    });
    elWrapper.appendChild(dot);
  });
}

function toggleBubble(dot, spot, imgId, idx) {
	const existing = elWrapper.querySelector('.hotspot-bubble');
	if (existing) { existing.remove(); return; }

	const wrapperRect = elWrapper.getBoundingClientRect();
	const dotPX = wrapperRect.width  * spot.x / 100;
	const dotPY = wrapperRect.height * spot.y / 100;

	const bubble = document.createElement('div');
	bubble.className = 'hotspot-bubble';
	const ox = 16, oy = 4;
	bubble.style.left = (dotPX + ox) + 'px';
	bubble.style.top  = (dotPY + oy) + 'px';
	bubble.style.setProperty('--bubble-x', (-ox) + 'px');
	bubble.style.setProperty('--bubble-y', (-oy) + 'px');

	bubble.innerHTML = '<span class="bubble-close">×</span><div class="bubble-title">' + spot.title + '</div><div class='bubble-text'>' + spot.text + '</div>';

	bubble.querySelector('.bubble-close').addEventListener('click', (e) => {
		e.stopPropagation(); bubble.remove();
	});
	elWrapper.appendChild(bubble);
	requestAnimationFrame(() => bubble.classList.add('show'));

	setTimeout(() => {
		const outside = (e) => {
			if (!bubble.contains(e.target) && e.target !== dot) {
				bubble.remove(); document.removeEventListener('click', outside);
			}
		};
		document.addEventListener('click', outside);
	}, 0);
}

// ============================================================
//  State
// ============================================================
let currentIndex   = 0;
let showAnnotations = true;
let filteredIndices = IMAGES.map((_, i) => i);

let loadToken    = 0;
let activeImg    = 'A';         // 当前显示的图片元素
let slideTimer   = null;        // 动画结束定时器
const cached = {};              // "idx_raw" or "idx_ann"

// ============================================================
//  DOM refs
// ============================================================
const imgs = {
  A: document.getElementById('imgA'),
  B: document.getElementById('imgB')
};
const elCounter  = document.getElementById('counter');
const elTitle    = document.getElementById('imageTitle');
const elToggle   = document.getElementById('toggleBtn');
const elToggleLbl = document.getElementById('toggleLabel');
const elWrapper  = document.getElementById('imageWrapper');

function activeEl() { return imgs[activeImg]; }
function inactiveEl() { return imgs[activeImg === 'A' ? 'B' : 'A']; }

// ============================================================
//  Helpers
// ============================================================
function getImagePath(index) {
  const meta = IMAGES[index];
  const fn = fileFor(meta.id);
  return showAnnotations && meta.ann ? `${ANNOT_DIR}/${fn}` : `${RAW_DIR}/${fn}`;
}

// ============================================================
//  Navigation — instant crossfade + skeleton while loading
// ============================================================
const EMPTY_PIXEL = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

function navigate(delta) {
  if (filteredIndices.length === 0) return;
  const nextIdx = (currentIndex + delta + filteredIndices.length) % filteredIndices.length;
  if (nextIdx === currentIndex) return;

  currentIndex = nextIdx;
  const realIdx = filteredIndices[currentIndex];
  const src = getImagePath(realIdx);
  const meta = IMAGES[realIdx];
  const cacheKey = realIdx + (showAnnotations ? '_ann' : '_raw');
  const token = ++loadToken;

  resetZoom();
  elCounter.textContent = `${currentIndex + 1} / ${filteredIndices.length}`;
  elTitle.textContent   = `${meta.id} ${meta.label}`;
  elToggle.classList.toggle('active', showAnnotations);
  elToggleLbl.textContent = showAnnotations ? '隐藏标注' : '显示标注';

  // 1. IMMEDIATE crossfade — 已经切过去了
  const inactive = inactiveEl();
  const oldOne   = activeEl();
  clearTimeout(slideTimer);
  oldOne.classList.remove('active');
  inactive.src = EMPTY_PIXEL;
  inactive.classList.add('active');
  activeImg = activeImg === 'A' ? 'B' : 'A';  // 立即交换，renderHotspots 用
  renderHotspots(meta.id);

  // skeleton 可见
  elWrapper.classList.add('loading');

  // 2. Clean old image after transition
  slideTimer = setTimeout(() => {
    oldOne.className = 'slide-img';
    oldOne.src = EMPTY_PIXEL;
    slideTimer = null;
  }, 400);

  // 3. Set the new active image once loaded
  const newActiveEl = inactive; // 它就是新的 active
  const showImage = () => {
    if (token !== loadToken) return;
    newActiveEl.src = src;
    elWrapper.classList.remove('loading');
  };

  if (cached[cacheKey]) {
    showImage();
  } else {
    const preloader = new Image();
    preloader.onload = () => {
      cached[cacheKey] = true;
      showImage();
    };
    preloader.src = src;
  }
}

// ============================================================
//  Toggle Annotations
// ============================================================
function toggleAnnotations() {
  showAnnotations = !showAnnotations;
  elToggle.classList.toggle('active', showAnnotations);
  elToggleLbl.textContent = showAnnotations ? '隐藏标注' : '显示标注';
  const realIdx = filteredIndices[currentIndex];
  const cacheKey = realIdx + (showAnnotations ? '_ann' : '_raw');
  const src = getImagePath(realIdx);
  resetZoom();

  if (cached[cacheKey]) {
    activeEl().src = src;
    return;
  }
  const preloader = new Image();
  preloader.onload = () => {
    cached[cacheKey] = true;
    activeEl().src = src;
  };
  preloader.src = src;
}

function updateImage() {
  const realIdx = filteredIndices[currentIndex];
  if (realIdx === undefined) return;
  const src = getImagePath(realIdx);
  const meta = IMAGES[realIdx];
  const cacheKey = realIdx + (showAnnotations ? '_ann' : '_raw');
  const token = ++loadToken;

  elCounter.textContent = `${currentIndex + 1} / ${filteredIndices.length}`;
  elTitle.textContent   = `${meta.id} ${meta.label}`;
  elToggle.classList.toggle('active', showAnnotations);
  elToggleLbl.textContent = showAnnotations ? '隐藏标注' : '显示标注';
  resetZoom();
  renderHotspots(meta.id);

  const el = activeEl();
  if (cached[cacheKey]) {
    if (token !== loadToken) return;
    el.src = src;
    elWrapper.classList.remove('loading');
    return;
  }
  elWrapper.classList.add('loading');
  const preloader = new Image();
  preloader.onload = () => {
    if (token !== loadToken) return;
    cached[cacheKey] = true;
    el.src = src;
    elWrapper.classList.remove('loading');
  };
  preloader.src = src;
}

function nextImage() { navigate(1); }
function prevImage() { navigate(-1); }

// ============================================================
//  Zoom
// ============================================================
let zoomEnabled = false;
let zoomScale  = 1;
let zoomX = 0, zoomY = 0;
let panning = false, panStartX = 0, panStartY = 0, panOrgX = 0, panOrgY = 0;

const elZoom    = document.getElementById('zoomBtn');
const elZoomLbl = document.getElementById('zoomLabel');

function toggleZoom() {
  zoomEnabled = !zoomEnabled;
  elZoom.classList.toggle('active', zoomEnabled);
  elZoomLbl.textContent = zoomEnabled ? '缩放' : '缩放';
  elWrapper.classList.toggle('zooming', zoomEnabled);
  if (!zoomEnabled) resetZoom();
}

function resetZoom() {
  zoomScale = 1; zoomX = 0; zoomY = 0;
  applyZoom();
}

function applyZoom() {
  const el = activeEl();
  if (!zoomEnabled || zoomScale === 1) {
    el.style.transform = '';
    return;
  }
  el.style.transform = `translate(${zoomX}px,${zoomY}px) scale(${zoomScale})`;
  el.style.transformOrigin = '0 0';
}

elWrapper.addEventListener('wheel', (e) => {
  if (!zoomEnabled) return;
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.min(5, Math.max(1, zoomScale * delta));
  const el = activeEl();
  const rect = el.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  zoomX = zoomX - cx * (newScale - zoomScale) / zoomScale;
  zoomY = zoomY - cy * (newScale - zoomScale) / zoomScale;
  zoomScale = newScale;
  applyZoom();
}, { passive: false });

elWrapper.addEventListener('pointerdown', (e) => {
  if (!zoomEnabled) return;
  panning = true;
  panStartX = e.clientX; panStartY = e.clientY;
  panOrgX = zoomX; panOrgY = zoomY;
  elWrapper.setPointerCapture(e.pointerId);
});
elWrapper.addEventListener('pointermove', (e) => {
  if (!panning) return;
  zoomX = panOrgX + (e.clientX - panStartX);
  zoomY = panOrgY + (e.clientY - panStartY);
  applyZoom();
});
elWrapper.addEventListener('pointerup', () => { panning = false; });
elWrapper.addEventListener('dblclick', (e) => {
  if (!zoomEnabled) return;
  zoomScale = zoomScale > 1.5 ? 1 : 2;
  applyZoom();
});

// ============================================================
//  Welcome → Gallery
// ============================================================
function enterGallery() {
  document.getElementById('welcome').classList.add('hidden');
  currentIndex = 0;
  filteredIndices = IMAGES.map((_, i) => i);
  updateImage();
}

function goHome() {
  document.getElementById('welcome').classList.remove('hidden');
}

// ============================================================
//  Toast
// ============================================================
let toastTimeout;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove('show'), 2500);
}

// ============================================================
//  Keyboard
// ============================================================
document.addEventListener('keydown', (e) => {
  // ignore when welcome is visible
  if (!document.getElementById('welcome').classList.contains('hidden')) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enterGallery(); }
    return;
  }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); prevImage(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); nextImage(); }
  if (e.key === 'Escape')     { goHome(); }
  if (e.key === 'a' || e.key === 'A') { toggleAnnotations(); }
});

// ============================================================
//  Touch swipe (单指切图，多指忽略)
// ============================================================
let touchStartX = 0, touchStartY = 0, touchFingers = 0;
document.addEventListener('touchstart', (e) => {
  touchFingers = e.touches.length;
  if (touchFingers === 1) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
});
document.addEventListener('touchend', (e) => {
  if (touchFingers !== 1) return;  // 多指操作：不管
  const dx = touchStartX - e.changedTouches[0].clientX;
  const dy = Math.abs(touchStartY - e.changedTouches[0].clientY);
  if (Math.abs(dx) > 60 && Math.abs(dx) > dy) {
    dx > 0 ? nextImage() : prevImage();
  }
});

// ============================================================
//  Init — preload onto welcome screen background
// ============================================================
// ============================================================
//  Event Listeners
// ============================================================
document.getElementById('btnEnter').addEventListener('click', enterGallery);
document.getElementById('btnPrev').addEventListener('click', prevImage);
document.getElementById('btnNext').addEventListener('click', nextImage);
document.getElementById('btnHome').addEventListener('click', goHome);
document.getElementById('toggleBtn').addEventListener('click', toggleAnnotations);
document.getElementById('zoomBtn').addEventListener('click', toggleZoom);

console.log('🏠 宿舍尺寸指南 loaded — 共 ' + IMAGES.length + ' 张图片，' + IMAGES.filter(i => i.ann).length + ' 张已标注');
document.getElementById('footerNote').textContent =
  '共 ' + IMAGES.length + ' 张示意图 · 均含尺寸标注';
</script>
</body>
</html>
