<script>
// ========== Feedback API ==========
const PAGE_ID = 'portal';

async function loadLikes() {
  const r = await fetch('/api/likes?page=' + PAGE_ID);
  const d = await r.json();
  document.getElementById('fbLikeCount').textContent = d.count;
}

document.getElementById('fbLikeBtn').addEventListener('click', async function() {
  const liked = this.classList.toggle('liked');
  localStorage.setItem('liked_portal', liked ? '1' : '0');
  const r = await fetch('/api/likes', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({page: PAGE_ID, delta: liked ? 1 : -1}) });
  const d = await r.json();
  document.getElementById('fbLikeCount').textContent = d.count;
});

// 初始化时恢复点赞状态
if (localStorage.getItem('liked_portal') === '1') {
  document.getElementById('fbLikeBtn').classList.add('liked');
}

// 显示自己发过的留言
function showMyComments() {
  const el = document.getElementById('fbMyComments');
  const saved = JSON.parse(localStorage.getItem('my_comments') || '[]');
  if (!saved.length) { el.innerHTML = ''; return; }
  el.innerHTML = saved.reverse().map(c =>
    '<div class="fb-my-item">' + esc(c.text) + '<div class="fb-my-time">' + c.time + '</div></div>'
  ).join('');
}
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

document.getElementById('fbSubmit').addEventListener('click', async function() {
  const text = document.getElementById('fbText').value.trim();
  const name = document.getElementById('fbName').value.trim();
  if (!text) return;
  this.disabled = true; this.textContent = '发送中…';
  try {
    await fetch('/api/comments', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({page:PAGE_ID, text, nickname: name || '匿名'}) });
    document.getElementById('fbText').value = '';
    this.textContent = '已收到 🎉';
    // 存本地
    const saved = JSON.parse(localStorage.getItem('my_comments') || '[]');
    saved.push({ text: (name ? name + '：' : '') + text, time: new Date().toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) });
    if (saved.length > 10) saved.splice(0, saved.length - 10);
    localStorage.setItem('my_comments', JSON.stringify(saved));
    showMyComments();
  } catch(e) { this.textContent = '发送失败'; }
  finally { setTimeout(() => { this.disabled = false; this.textContent = '发送'; }, 2000); }
});

showMyComments();

// 随机标题
var likeLabels = [
  '这个页面有帮助吗？',
  '如果能帮到你，点个赞再走 👍',
  '觉得有用的话，点个赞吧',
  '内容还满意吗？',
];
var commentTitles = [
  '有什么想说的？',
  '唠唠嗑～',
  '欢迎留言 ✌️',
  '来都来了，说两句呗',
  '键盘交给你了',
  '随便说点啥',
];
var placeholders = [
  '反馈、建议、或者单纯打个招呼…',
  '随便说点啥，我在听',
  '说说你的想法',
  '畅所欲言～',
];
document.querySelector('.fb-label').textContent = likeLabels[Math.floor(Math.random() * likeLabels.length)];
document.getElementById('fbTitle').textContent = commentTitles[Math.floor(Math.random() * commentTitles.length)];
document.getElementById('fbText').placeholder = placeholders[Math.floor(Math.random() * placeholders.length)];

loadLikes();

</script>

(function makeStars() {
  const field = document.createElement('div');
  field.className = 'star-field';
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('i');
    const r = Math.random();
    const size = r < 0.78 ? 1 : (r < 0.95 ? 2 : 3); // 1/2/3px 三档
    s.style.left = (Math.random() * 100).toFixed(2) + '%';
    s.style.top = (Math.random() * 100).toFixed(2) + '%';
    s.style.width = s.style.height = size + 'px';
    // 每颗星的闪烁节奏随机：2-5 秒周期 + 随机延迟（此起彼伏）
    s.style.animationDuration = (2 + Math.random() * 3).toFixed(2) + 's';
    s.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
    field.appendChild(s);
  }
  document.body.appendChild(field);
  // 流星：3 颗随机位置；第一颗很快出现，之后间隔约 7 秒错落划过（保持稀疏）
  for (let i = 0; i < 3; i++) {
    const m = document.createElement('div');

    m.style.left = (60 + Math.random() * 35).toFixed(1) + '%';

    m.style.animationDelay = (0.5 + i * 7 + Math.random() * 2).toFixed(2) + 's';
    document.body.appendChild(m);
  }
})();

MODULES.forEach((m, i) => {
  const card = document.createElement('a');
  card.className = 'card' + (m.status === 'ready' ? ' ready' : ' disabled');
  // 依次入场：每张卡片延迟 80ms 淡入上浮
  card.style.animation = 'fadeUp 0.5s ease both';
  card.style.animationDelay = (i * 0.08) + 's';

  if (m.status === 'ready') {
    card.href = m.path;
  } else {
    card.href = 'javascript:void(0)';
    card.addEventListener('click', (e) => e.preventDefault());
  }

  const tagHtml = m.status !== 'ready' ? '<span class="coming-tag">即将上线</span>' :
    (m.tag ? '<span class="coming-tag">' + m.tag + '</span>' : '');

  card.innerHTML = `
    <div class="icon">${m.icon}</div>
    <h2>${m.title}</h2>
    <p>${m.desc}</p>
    <span class="action">${m.status === 'ready' ? '开始浏览 →' : '即将推出'}</span>
    ${tagHtml}
  `;

  grid.appendChild(card);
});

// ===== 打赏弹窗开关 =====
document.getElementById('rewardBtn').addEventListener('click', function() {
  document.getElementById('rewardModal').classList.add('show');
});
document.getElementById('rewardClose').addEventListener('click', function() {
  document.getElementById('rewardModal').classList.remove('show');
});
document.getElementById('rewardModal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('show');
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') document.getElementById('rewardModal').classList.remove('show');
});
</script>
</body>
</html>
