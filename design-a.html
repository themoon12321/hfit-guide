<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 · 左分栏</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", serif;
    background: #0d0d0f;
    color: #eaeaef;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center;
    justify-content: center;
    padding: 0 40px;
    overflow: hidden;
  }

  /* Giant HFIT — spans full height, bleeds off top/bottom */
  .giant {
    position: fixed;
    left: 50%; top: -10%; bottom: -10%;
    transform: translateX(-50%) rotate(-4deg);
    pointer-events: none;
    z-index: 1;
    display: flex; align-items: center;
    justify-content: center;
    width: 100%;
  }
  .giant span {
    font-size: min(85vh, 900px);
    font-weight: 700;
    color: rgba(255,255,255,0.018);
    letter-spacing: -0.08em;
    line-height: 1;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    user-select: none;
    white-space: nowrap;
  }

  .container {
    display: flex; gap: 100px;
    max-width: 1100px; width: 100%;
    position: relative; z-index: 2;
    align-items: flex-end;
    justify-content: center;
  }

  /* ========== Left — title, bigger, higher ========== */
  .left-col {
    flex-shrink: 0;
    width: 300px;
    padding-bottom: 80px;
  }
  .left-col .kicker {
    font-size: 10px; font-weight: 600; letter-spacing: 2.5px;
    color: rgba(255,255,255,0.08);
    text-transform: uppercase;
    margin-bottom: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  }
  .left-col h1 {
    font-size: 80px; font-weight: 650; letter-spacing: -2.5px;
    line-height: 0.88;
    color: #f0f0f8;
  }
  .left-col h1 .en {
    display: block;
    font-size: 13px; font-weight: 400; letter-spacing: 4px;
    color: rgba(255,255,255,0.06);
    margin-top: 20px;
    text-transform: uppercase;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  }

  /* ========== Right — list, lower ========== */
  .right-col {
    flex: 1;
    padding-top: 100px;
  }
  .entry {
    display: flex; align-items: center;
    padding: 22px 0;
    text-decoration: none; color: inherit;
    border-top: 1px solid rgba(255,255,255,0.04);
    gap: 24px;
    transition: opacity 0.2s;
    cursor: default;
  }
  .entry:last-of-type { border-bottom: 1px solid rgba(255,255,255,0.04); }
  .entry.ready { cursor: pointer; }
  .entry.ready:hover { opacity: 0.6; }

  .entry .num {
    font-size: 11px; font-feature-settings: "tnum";
    color: rgba(255,255,255,0.08);
    width: 24px; flex-shrink: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  }
  .entry .body { flex: 1; }
  .entry .body .name {
    font-size: 21px; font-weight: 500; letter-spacing: -0.1px;
    color: #eaeaef;
  }
  .entry .body .desc {
    font-size: 13px; color: rgba(255,255,255,0.15);
    margin-top: 3px;
  }
  .entry .tag {
    font-size: 11px; color: rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .entry.ready .tag { color: rgba(255,255,255,0.15); }
  .entry.ready:hover .tag { color: rgba(255,255,255,0.45); }
  .entry.disabled { opacity: 0.2; }

  .left-foot {
    margin-top: 48px;
    font-size: 12px; color: rgba(255,255,255,0.05);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  }
  .left-foot a {
    color: rgba(255,255,255,0.1); text-decoration: none;
    margin-right: 14px;
    transition: color 0.12s;
  }
  .left-foot a:hover { color: rgba(255,255,255,0.25); }

  @media (max-width: 860px) {
    body { padding: 40px 24px; overflow: auto; align-items: flex-start; }
    .giant { display: none; }
    .container { flex-direction: column; gap: 20px; }
    .left-col { width: auto; padding-bottom: 0; }
    .left-col h1 { font-size: 48px; }
    .right-col { padding-top: 0; }
  }
</style>
</head>
<body>
<div class="giant"><span>HFIT</span></div>

<div class="container">
  <div class="left-col">
    <div class="kicker">Hefei Institute of Technology</div>
    <h1>合肥<br>理工<br>学院<br>指南<span class="en">Guide</span></h1>
    <div class="left-foot">
      <a href="#">关于我</a>
      <span>2026</span>
    </div>
  </div>
  <div class="right-col">
    <a href="#" class="entry ready" onclick="alert('→ dorm/index.html')">
      <span class="num">01</span>
      <span class="body">
        <span class="name">宿舍尺寸指南</span>
        <span class="desc">床 · 书桌 · 衣柜 · 楼梯 — 16 张实际尺寸图</span>
      </span>
      <span class="tag">进入</span>
    </a>
    <div class="entry disabled">
      <span class="num">02</span>
      <span class="body">
        <span class="name">学习指南</span>
        <span class="desc">教学楼 · 自习室 · 选课攻略</span>
      </span>
      <span class="tag">即将上线</span>
    </div>
    <div class="entry disabled">
      <span class="num">03</span>
      <span class="body">
        <span class="name">校园指南</span>
        <span class="desc">食堂 · 快递 · 运动场所 · 周边交通</span>
      </span>
      <span class="tag">即将上线</span>
    </div>
  </div>
</div>
</body>
</html>
