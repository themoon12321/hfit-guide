<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · 留言管理</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
    background: #0d0d0f;
    color: #eaeaef;
    -webkit-font-smoothing: antialiased;
    padding: 40px 24px;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
  }

  /* Login */
  .login { margin-top: 120px; text-align: center; }
  .login h1 { font-size: 24px; font-weight: 600; margin-bottom: 24px; color: #f5f5fa; }
  .login input {
    padding: 12px 18px; border-radius: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    color: #f0f0f5; font-size: 16px; font-family: inherit;
    outline: none; width: 240px;
  }
  .login input:focus { border-color: rgba(255,255,255,0.25); }
  .login button {
    margin-top: 14px; padding: 10px 28px; border-radius: 12px;
    background: rgba(255,255,255,0.09); border: none;
    color: rgba(255,255,255,0.7); font-size: 15px; cursor: pointer;
    font-family: inherit;
  }
  .login button:hover { background: rgba(255,255,255,0.14); color: rgba(255,255,255,0.9); }
  .login .err { color: #ff6b6b; font-size: 14px; margin-top: 12px; }

  /* Dashboard */
  .dash { width: 100%; max-width: 720px; }
  .dash h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; color: #f0f0f5; }
  .dash .sub { font-size: 13px; color: rgba(255,255,255,0.25); margin-bottom: 28px; }
  .section { margin-bottom: 36px; }
  .section h2 { font-size: 16px; font-weight: 500; color: rgba(255,255,255,0.5); margin-bottom: 14px; }
  .item {
    padding: 14px 18px; border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    margin-bottom: 10px;
    display: flex; gap: 14px; align-items: flex-start;
  }
  .item .body { flex: 1; }
  .item .body .text { font-size: 15px; color: rgba(255,255,255,0.75); line-height: 1.55; }
  .item .body .meta { font-size: 12px; color: rgba(255,255,255,0.2); margin-top: 6px; }
  .item .del {
    flex-shrink: 0; padding: 6px 14px; border-radius: 8px;
    background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.15);
    color: rgba(255,80,80,0.5); font-size: 13px; cursor: pointer;
    font-family: inherit; transition: background 0.2s, color 0.2s;
  }
  .item .del:hover { background: rgba(255,80,80,0.2); color: #ff6b6b; }
  .empty { font-size: 14px; color: rgba(255,255,255,0.12); text-align: center; padding: 28px 0; }
  .back { display: inline-block; margin-top: 24px; font-size: 13px; color: rgba(255,255,255,0.15); text-decoration: none; }
  .back:hover { color: rgba(255,255,255,0.35); }

  /* Confirm modal */
  #confirmModal {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,0.65);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  #confirmModal.show { opacity: 1; pointer-events: auto; }
  .confirm-box {
    background: #1a1a1e; border-radius: 16px;
    padding: 28px 24px 20px; max-width: 340px; width: 88%;
    border: 1px solid rgba(255,255,255,0.06);
    text-align: center;
  }
  .confirm-box p { font-size: 15px; color: rgba(255,255,255,0.6); margin-bottom: 20px; }
  .confirm-box .c-btn { display: flex; gap: 10px; justify-content: center; }
  .confirm-box .c-btn button {
    padding: 8px 24px; border-radius: 10px;
    border: none; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .confirm-box .c-btn .c-yes { background: rgba(255,80,80,0.15); color: #ff6b6b; }
  .confirm-box .c-btn .c-yes:hover { background: rgba(255,80,80,0.25); }
  .confirm-box .c-btn .c-no { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); }
  .confirm-box .c-btn .c-no:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }
</style>
</head>
<body>

<div id="login" class="login">
  <h1>🔐 留言管理</h1>
  <input type="password" id="pwdInput" placeholder="输入密码" onkeydown="if(event.key==='Enter')login()"><br>
  <button onclick="login()">进入</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="dash" class="dash" style="display:none">
  <h1>留言管理</h1>
  <div class="sub">只有你能看到这个页面</div>
  <div id="pagesContainer"></div>
  <a class="back" href="index.html">← 返回首页</a>
</div>

<!-- Confirm Modal -->
<div id="confirmModal">
  <div class="confirm-box">
    <p>确定删除这条留言？</p>
    <div class="c-btn">
      <button class="c-no" id="confirmNo">取消</button>
      <button class="c-yes" id="confirmYes">删除</button>
    </div>
  </div>
</div>

<script>
const PASSWORD_HASH = '18f6dd1e1391ae8f6e81600d72cedaed9aa3a1703fa88b50d3b4e40e2855cfc8';
var pendingDel = null;

async function login() {
  var val = document.getElementById('pwdInput').value;
  var hash = await sha256(val);
  if (hash !== PASSWORD_HASH) {
    document.getElementById('loginErr').textContent = '密码错误';
    return;
  }
  document.getElementById('login').style.display = 'none';
  document.getElementById('dash').style.display = 'block';
  loadAll();
}

async function loadAll() {
  var pages = ['portal', 'dorm', 'faq'];
  var html = '';
  for (var i = 0; i < pages.length; i++) {
    var page = pages[i];
    try {
      var r = await fetch('/api/comments?page=' + page);
      var list = await r.json();
      var titles = { portal: '门户主页', dorm: '宿舍尺寸指南', faq: 'FAQ 提问' };
      html += '<div class="section"><h2>' + (titles[page] || page) + ' · ' + (list ? list.length : 0) + ' 条</h2>';
      if (!list || !list.length) {
        html += '<div class="empty">暂无留言</div>';
      } else {
        for (var j = 0; j < list.length; j++) {
          var c = list[j];
          html += '<div class="item"><div class="body"><div class="text">' + esc(c.text) + '</div><div class="meta">' + esc(c.nickname) + ' · ' + (c.time ? new Date(c.time).toLocaleString('zh-CN') : '') + '</div></div><button class="del" data-page="' + page + '" data-id="' + c.id + '">删除</button></div>';
        }
      }
      html += '</div>';
    } catch(e) {
      html += '<div class="section"><h2>' + page + '</h2><div class="empty">加载失败</div></div>';
    }
  }
  document.getElementById('pagesContainer').innerHTML = html;
  // Bind delete buttons
  var btns = document.querySelectorAll('.del');
  for (var k = 0; k < btns.length; k++) {
    btns[k].addEventListener('click', function() {
      pendingDel = { page: this.dataset.page, id: this.dataset.id };
      document.getElementById('confirmModal').classList.add('show');
    });
  }
}

document.getElementById('confirmYes').addEventListener('click', async function() {
  if (!pendingDel) return;
  document.getElementById('confirmModal').classList.remove('show');
  var r = await fetch('/api/comments?page=' + pendingDel.page);
  var list = await r.json();
  var filtered = [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].id !== pendingDel.id) filtered.push(list[i]);
  }
  await fetch('/api/comments', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({page: pendingDel.page, text: '---REPLACE---', _replace: filtered})
  });
  pendingDel = null;
  loadAll();
});
document.getElementById('confirmNo').addEventListener('click', function() {
  document.getElementById('confirmModal').classList.remove('show');
  pendingDel = null;
});
document.getElementById('confirmModal').addEventListener('click', function(e) {
  if (e.target === this) {
    this.classList.remove('show');
    pendingDel = null;
  }
});

async function sha256(s) {
  var b = new TextEncoder().encode(s);
  var h = await crypto.subtle.digest('SHA-256', b);
  var r = '';
  var u = new Uint8Array(h);
  for (var i = 0; i < u.length; i++) {
    var hex = u[i].toString(16);
    if (hex.length === 1) hex = '0' + hex;
    r += hex;
  }
  return r;
}
function esc(s) { var d = document.createElement('div'); d.textContent = s || '匿名'; return d.innerHTML; }
</script>
</body>
</html>
